<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Lector de documentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">

<!-- pdf.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- StPageFlip -->
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<style>
  :root{
    --bg-viewer: #232323;
    --bg-viewer-2: #1c1c1c;
    --bg-toolbar: rgba(17,17,18,0.88);
    --bg-panel: #1a1a1c;
    --ink: #f2f1ee;
    --ink-dim: #9a9995;
    --ink-faint: #6b6a67;
    --accent: #e7e7e4;
    --accent-bright: #f5f5f3;
    --accent-text: #e5e4e0;
    --accent-ink: #1c1c1c;
    --page-white: #fbfaf7;
    --border: rgba(255,255,255,0.08);
    --shadow-deep: 0 30px 80px rgba(0,0,0,0.55);
    --radius: 10px;
    --font-display: 'Plus Jakarta Sans', system-ui, sans-serif;
    --font-body: 'Manrope', system-ui, sans-serif;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    /* iOS/iPadOS Safari's "100%"/"100vh" is based on the largest possible
       viewport (as if the address bar were always hidden), which can make
       #app taller than what's actually visible and push the toolbar below
       the fold with no way to scroll to it (html/body are overflow:
       hidden). -webkit-fill-available reports the real, currently-visible
       height instead; harmless no-op on browsers that don't support it. */
    height: -webkit-fill-available;
    background: var(--bg-viewer);
    font-family: var(--font-body);
    color: var(--ink);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  #app{
    position: relative;
    width: 100vw;
    height: 100vh;
    /* Same iOS/iPadOS fix as above, layered from least to most capable so
       every engine lands on the best unit it understands: 100vh first as
       a universal fallback, -webkit-fill-available for older iOS Safari,
       then 100dvh (the *dynamic* viewport height, which tracks the
       address bar/toolbar actually collapsing or expanding) for modern
       browsers — this is what keeps the bottom toolbar on-screen instead
       of clipped whenever iOS's chrome is taller than assumed. */
    height: -webkit-fill-available;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(ellipse 90% 60% at 50% 8%, rgba(255,255,255,0.05), transparent 60%),
      linear-gradient(180deg, var(--bg-viewer) 0%, var(--bg-viewer-2) 100%);
  }

  /* ---------- Viewer stage ---------- */
  #stage{
    position: relative;
    flex: 1 1 auto;
    display: flex;
    /* Content is centered manually (see updateZoomLayout in the script)
       via real margins on #book-zoom-sizer instead of flex centering.
       Centering an overflowing item with align-items/justify-content:
       center is what silently made the top/left portion of a zoomed
       page unreachable by scrolling — flex-start here, combined with
       JS-computed margins, keeps the same centered look at low zoom
       while guaranteeing every edge is reachable once zoomed in. */
    align-items: flex-start;
    justify-content: flex-start;
    /* Always hidden — no scrollbars, no native wheel/trackpad/touch
       scrolling, ever. #stage still has real scrollLeft/scrollTop
       (setting them via script always works regardless of the overflow
       value), so movement once the content is cropped happens only
       through our own pan-drag handler, which sets those directly. */
    overflow: hidden;
    padding: 28px 76px 40px;
    /* Touch devices: hand every touch gesture over #stage to our own JS
       (pan-drag, pinch handled the same as desktop) instead of letting
       the browser's native scroll/pinch-zoom compete with it. */
    touch-action: none;
  }
  /* Whenever the content is cropped (larger than the visible viewport in
     either dimension), plain drag pans instead of turning a page or
     selecting text — the grab/grabbing cursor is the usual affordance for
     that, shown over the book itself (not the dark margin around it). */
  #stage.pan-active #book{ cursor: grab; }
  #stage.pan-active.panning #book{ cursor: grabbing; }

  /* #book-zoom-sizer is a plain, unscaled block box whose real pixel size
     (set in JS) tracks scaledWidth/scaledHeight = natural size × zoom.
     Because that's genuine layout size — not just a visual transform —
     #stage's native overflow:auto scrolling covers the full, symmetric
     0..max range on both axes, so every edge of a zoomed document is
     always reachable, in every direction. */
  #book-zoom-sizer{
    position: relative;
    flex: none;
    transition: width 0.22s cubic-bezier(.4,0,.2,1), height 0.22s cubic-bezier(.4,0,.2,1), margin 0.22s cubic-bezier(.4,0,.2,1);
  }

  /* IMPORTANT: this whole chain (#book-zoom-wrap -> #book) must keep
     transform-style: preserve-3d and must NEVER receive a CSS `filter`.
     Both `filter` and a `transform` without preserve-3d silently flatten
     descendant 3D transforms, which is what makes StPageFlip's realistic
     page-turn break (pages stop rotating in 3D and just snap).
     #book-zoom-wrap is given an explicit, non-content-dependent size (not
     "shrink to fit") so StPageFlip's own stretch/autoSize resize logic
     always has a real, stable parent box to measure — mirroring the proven
     working reference exactly. Its own width/height stay fixed at the
     *natural* (zoom-independent) book size; only its CSS transform scales,
     from the top-left corner so it exactly fills #book-zoom-sizer, which
     is sized to that same natural size × the current zoom level. */
  #book-zoom-wrap{
    position: absolute;
    /* Overridden from JS (applyZoom/animateZoomTo) to the current pan-
       buffer offset (see computePanExtra) whenever the document
       overflows the viewport — these 0 values are just the correct
       starting point before the first JS layout pass runs, and what it
       falls back to whenever there's no buffer to apply. */
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.22s cubic-bezier(.4,0,.2,1);
    transform-origin: top left;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    will-change: transform;
  }

  #book{
    background: transparent;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
  }

  /* StPageFlip's own internal wrapper elements (created around the page
     elements we hand it via loadFromHTML) can default to a white
     background. When a cover page is shown alone, that leaves a blank
     white block filling the other half of the spread. Keeping every
     StPageFlip wrapper transparent means that empty half shows the
     viewer's own dark background instead, blending in rather than
     standing out as a stray white page. Only the actual ".page" element
     (the real page content) stays page-white. */
  #book, #book .stf__parent, #book .stf__block, #book .stf__wrapper, #book .stf__item{
    background: transparent !important;
  }

  /* Base styling for the ".page" elements we build ourselves in
     buildPageElements() and hand to StPageFlip's HTML mode
     (loadFromHTML). See further down for .page-inner/.page-bg/
     .page-text-layer, which give each page its background image and
     selectable text on top of it. */
  #book .page{ background: var(--page-white); }
  #book img{
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* ---------- Native selectable text layer ----------
     Each page is a real DOM element (StPageFlip HTML mode, loadFromHTML)
     containing the rasterized page image plus this transparent text
     layer on top, positioned from the same per-glyph percentages used
     for search highlighting (see pageTextItems). The glyphs are invisible
     (color: transparent) so the image underneath is what's seen, but the
     underlying characters are real, selectable, copyable text. */
  #book .page-inner{ position: relative; width: 100%; height: 100%; }
  #book .page-bg{
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  #book .page-text-layer{
    position: absolute; inset: 0;
    line-height: 1;
    z-index: 2;
  }
  #book .page-text-layer span{
    position: absolute;
    display: inline-block;
    color: transparent;
    white-space: pre;
    transform-origin: 0% 0%;
    /* Text selection is intentionally disabled throughout the viewer
       (search and links both work independently of it — search matches
       against the plain-text data used to build this layer, not against
       an actual DOM selection, and links live in their own separate
       layer above this one) — see the ::selection rule just below for
       why the rule itself is kept rather than removed outright. */
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
  }
  /* Belt-and-braces: user-select:none above already stops a *new*
     selection from starting here, but doesn't necessarily clear one
     already in progress that started on other (selectable) UI text and
     was merely dragged across this layer — this keeps that visually
     invisible too, consistent with "no text selection" everywhere in the
     viewer, in the one edge case user-select:none alone doesn't cover. */
  #book .page-text-layer span::selection{
    background: transparent;
    color: transparent;
  }

  /* ---------- PDF hyperlinks ----------
     A third layer, above the text layer, holding real clickable <a>
     elements positioned from the same per-annotation percentages the
     text layer uses for its spans (see pageLinkItems). Fully transparent
     — the rendered page image underneath is what's seen — but a real
     link/button sits exactly where the PDF's own link annotation was. */
  #book .page-link-layer{
    position: absolute; inset: 0;
    z-index: 3;
  }
  #book .page-link-layer a{
    position: absolute;
    display: block;
    cursor: pointer;
    /* Subtle affordance on hover/focus so a link is discoverable at all —
       PDF link annotations carry no visible styling of their own. */
    background: transparent;
    border-radius: 2px;
    outline: none;
  }
  /* Invisible, enlarged tap target: PDF link rects are often drawn tight
     around just the link text itself, which is a precise-enough target
     for a mouse pointer but easy to miss with a finger — especially at
     lower zoom levels, and especially on phones/tablets. A ::before
     pseudo-element positioned outside the <a>'s own box (via a negative
     inset) still counts as part of the <a> for click/tap hit-testing,
     so this pads the clickable area by a fixed amount on every side
     without changing anything about the link's own visible position or
     size. Fixed CSS pixels here reliably means fixed *screen* pixels at
     every zoom level: #book-zoom-wrap (and everything under it,
     including this) is sized to its true real pixel dimensions at the
     current zoom directly, not scaled up from a smaller layout via a
     CSS transform — so this padding neither shrinks at low zoom nor
     balloons at high zoom, it's just consistently ~12px of extra reach
     on every side, on any device. */
  #book .page-link-layer a::before{
    content: '';
    position: absolute;
    inset: -12px;
  }
  #book .page-link-layer a:hover, #book .page-link-layer a:focus-visible{
    background: rgba(90,150,255,0.16);
    box-shadow: 0 0 0 1px rgba(90,150,255,0.45);
  }

  /* In-document search highlighting: a single floating layer sitting on top
     of the book (outside StPageFlip's own DOM), repositioned via JS (in
     pixels, matching #book's actual rendered box) to whichever page(s) are
     currently on display. This avoids touching the library's internal page
     elements entirely. */
  #doc-highlight-overlay{
    position: absolute;
    pointer-events: none;
    z-index: 6;
  }
  .hl-mark{
    position: absolute;
    background: #ffe600;
    opacity: 0.42;
    mix-blend-mode: multiply;
    border-radius: 2px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
  }

  /* ---------- Side nav arrows ----------
     position: fixed (not absolute) is what keeps these anchored to the
     actual browser viewport — immune to #stage's scroll offset when
     panning and to #book-zoom-wrap's CSS transform when zooming. Their
     "top" is written in JS (see positionNavArrows) to track #stage's own
     vertical center, since fixed positioning is relative to the viewport
     as a whole rather than to #stage. A solid, high-contrast circle
     (rather than the previous barely-there translucent one) keeps them
     legible whether they're sitting over a white PDF page or the dark
     viewer chrome. */
  .nav-arrow{
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 46px;
    height: 132px;
    border-radius: 999px;
    background: rgba(30, 30, 32, 0.82);
    border: 1px solid rgba(255,255,255,0.1);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 8;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.45), 0 0 0 1px rgba(0,0,0,0.3);
    transition: background 0.15s ease, transform 0.15s ease, opacity 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .nav-arrow:hover{
    background: rgba(44, 44, 47, 0.9);
    border-color: rgba(255,255,255,0.22);
    box-shadow: 0 6px 22px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,0,0,0.3);
    transform: translateY(-50%) scale(1.03);
  }
  .nav-arrow:active{ transform: translateY(-50%) scale(0.97); }
  .nav-arrow.disabled{ opacity: 0.32; pointer-events: none; }
  .nav-arrow.prev{ left: 26px; }
  .nav-arrow.next{ right: 26px; }
  .nav-arrow svg{ width: 22px; height: 22px; }

  /* ---------- Back to the menu ----------
     A plain round icon button, same size and finish as the toolbar's own
     buttons (.tb-btn). Sibling of #toolbar rather than a child of #stage
     (which clips overflow), positioned so its centre lines up with the
     centre of #toolbar-inner, the icon row directly below it: the
     toolbar's bottom padding (12px + safe-area) plus half of
     #toolbar-inner's height (56px / 2 = 28px), minus half of this
     button's own height (19px). Above the loading overlay too, so it is
     still reachable if a document fails to open. */
  #btn-back{
    position: absolute;
    left: 18px;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px) + 28px - 19px);
    z-index: 60;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-toolbar);
    border: 1px solid var(--border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    color: var(--ink-dim);
    text-decoration: none;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
  }
  #btn-back svg{ width: 17px; height: 17px; }
  #btn-back:hover{
    background: rgba(255,255,255,0.1);
    color: var(--ink);
    transform: translateY(-1px);
  }
  #btn-back:active{ transform: translateY(0); }
  /* The menu screen has its own layout; the viewer's corner button has no
     place there. */
  body.library-mode #btn-back{ display: none; }

  /* ---------- Bottom toolbar ---------- */
  #toolbar{
    position: relative;
    z-index: 10;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 18px;
    /* Keep the pill clear of the home-indicator / rounded-corner safe
       area on notched iPads and iPhones (requires viewport-fit=cover on
       the viewport meta tag; a no-op everywhere else since env() falls
       back to 0). Added on top of, not instead of, the existing padding
       so there's still breathing room even where the inset is 0. */
    padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  }
  #toolbar-inner{
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--bg-toolbar);
    border: 1px solid var(--border);
    backdrop-filter: blur(14px);
    border-radius: 999px;
    padding: 8px 10px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }

  .tb-btn{
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    color: var(--ink-dim);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
    position: relative;
  }
  .tb-btn:hover{ background: rgba(255,255,255,0.08); color: var(--ink); }
  .tb-btn.active{ background: var(--accent); color: var(--accent-ink); }
  .tb-btn svg{ width: 18px; height: 18px; }

  .tb-sep{
    width: 1px;
    height: 22px;
    background: var(--border);
    margin: 0 6px;
  }

  #page-indicator{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 13px;
    color: var(--ink);
    padding: 0 12px;
    white-space: nowrap;
    min-width: 78px;
    text-align: center;
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
  }
  #page-indicator .total{ color: var(--ink-faint); font-weight: 500; }

  #zoom-group{
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 4px;
  }
  #zoom-slider{
    -webkit-appearance: none;
    appearance: none;
    width: 96px;
    height: 3px;
    background: var(--border);
    border-radius: 3px;
    outline: none;
    cursor: pointer;
  }
  #zoom-slider::-webkit-slider-thumb{
    -webkit-appearance: none;
    appearance: none;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: var(--accent-bright);
    cursor: pointer;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.22);
  }
  #zoom-slider::-moz-range-thumb{
    width: 13px; height: 13px; border: none;
    border-radius: 50%;
    background: var(--accent-bright);
    cursor: pointer;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.22);
  }
  #zoom-value{
    font-size: 11px;
    color: var(--ink-faint);
    min-width: 34px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Thumbnail panel ---------- */
  #thumbnail-panel{
    position: absolute;
    left: 0; right: 0; bottom: 88px;
    margin: 0 auto;
    width: min(960px, 94vw);
    max-height: 56vh;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow-deep);
    padding: 20px 22px;
    z-index: 12;
    display: none;
    flex-direction: column;
    gap: 14px;
  }
  #thumbnail-panel.open{ display: flex; }
  #thumbnail-panel h4{
    margin: 0 2px;
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  #thumbnail-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
    grid-auto-rows: min-content;
    gap: 22px 20px;
    overflow-y: auto;
    padding: 6px 6px 10px;
  }
  .thumb{
    cursor: pointer;
    border-radius: 10px;
    background: rgba(255,255,255,0.03);
    border: 2px solid transparent;
    padding: 8px 8px 0;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    transition: border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
  }
  .thumb:hover{
    transform: translateY(-3px);
    background: rgba(255,255,255,0.06);
  }
  .thumb.current{
    border-color: var(--accent-bright);
    background: rgba(255,255,255,0.08);
  }
  .thumb-frame{
    position: relative;
    width: 100%;
    /* Falls back to a generic 3:4 page shape until buildThumbnails() sets
       --thumb-page-ratio from the PDF's actual (single-page) width/height
       ratio, so thumbnails always mirror the real page proportions
       instead of assuming a fixed portrait shape. */
    aspect-ratio: var(--thumb-page-ratio, 3/4);
    background: var(--page-white);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 6px 16px rgba(0,0,0,0.35);
  }
  .thumb img{
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .thumb span{
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-dim);
    text-align: center;
    padding: 7px 0 9px;
    font-family: var(--font-display);
    letter-spacing: 0.02em;
  }
  .thumb.current span{ color: var(--accent-text); }

  /* ---------- Search panel ---------- */
  #search-panel{
    position: absolute;
    right: 24px; bottom: 84px;
    width: 300px;
    max-height: 50vh;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow-deep);
    z-index: 12;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  #search-panel.open{ display: flex; }
  #search-input-row{
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 12px;
    border-bottom: 1px solid var(--border);
  }
  #search-input-row svg{ width: 16px; height: 16px; color: var(--ink-faint); flex: 0 0 auto; }
  #search-input{
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 13px;
  }
  #search-input::placeholder{ color: var(--ink-faint); }
  #search-status{
    font-size: 11px;
    color: var(--ink-faint);
    padding: 0 12px 10px;
  }
  #search-results{
    overflow-y: auto;
    padding: 4px 6px 10px;
  }
  .search-hit{
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .search-hit:hover{ background: rgba(255,255,255,0.06); }
  .search-hit .hp{
    font-size: 11px;
    font-weight: 700;
    color: var(--accent-text);
    font-family: var(--font-display);
  }
  .search-hit .hs{
    font-size: 12px;
    color: var(--ink-dim);
    line-height: 1.4;
  }
  .search-hit .hs mark{
    background: #ffe600;
    color: #1a1a1a;
    border-radius: 2px;
    padding: 0 1px;
  }

  /* scrollbars for panels */
  #thumbnail-grid::-webkit-scrollbar, #search-results::-webkit-scrollbar{ width: 8px; }
  #thumbnail-grid::-webkit-scrollbar-thumb, #search-results::-webkit-scrollbar-thumb{
    background: rgba(255,255,255,0.12); border-radius: 8px;
  }

  /* ---------- Document library ---------- */
  /* Hidden by default; body.library-mode (added by the script, before
     anything else runs — see LIBRARY_MODE) is the only thing that swaps
     which of the two full-screen experiences is visible. #app stays in
     the DOM rather than being torn down, so navigating back to it (a
     card click just goes to ?pdf=..., a normal full page load) needs no
     special teardown here at all. */
  #library-screen{
    display: none;
    position: fixed;
    inset: 0;
    overflow-y: auto;
    background:
      radial-gradient(ellipse 90% 60% at 50% 8%, rgba(255,255,255,0.05), transparent 60%),
      linear-gradient(180deg, var(--bg-viewer) 0%, var(--bg-viewer-2) 100%);
  }
  body.library-mode #library-screen{ display: block; }
  body.library-mode #app{ display: none; }

  #library-inner{
    max-width: 1100px;
    margin: 0 auto;
    padding: 56px 32px 72px;
  }
  #library-header{
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 36px;
  }
  #library-title{
    margin: 0;
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  #library-search-row{
    display: flex;
    align-items: center;
    gap: 10px;
    width: min(340px, 100%);
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 16px;
  }
  #library-search-row svg{ width: 17px; height: 17px; color: var(--ink-faint); flex: 0 0 auto; }
  #library-search-input{
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
  }
  #library-search-input::placeholder{ color: var(--ink-faint); }

  #library-status{
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--ink-faint);
    padding: 4px 2px 28px;
  }

  #library-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(238px, 1fr));
    gap: 18px;
  }

  /* Cards are styled to match the model library in the IFC viewer exactly:
     framed tile, cover image bleeding to the edges, and a footer row with
     the name on the left and a round "open" arrow on the right. Hover
     lifts the whole card, deepens its border and shadow, eases the cover
     in a little closer, and fills the arrow with the accent colour. */
  .lib-card{
    display: flex;
    flex-direction: column;
    background: rgba(255,255,255,0.035);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    transition: transform 0.18s ease, border-color 0.18s ease,
                background 0.18s ease, box-shadow 0.18s ease;
  }
  .lib-card:hover, .lib-card:focus-visible{
    transform: translateY(-3px);
    border-color: rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.065);
    box-shadow: 0 18px 44px rgba(0,0,0,0.45);
    outline: none;
  }
  .lib-card:active{ transform: translateY(-1px); }
  /* Toggled by the search filter (see initLibrary in the script) rather
     than removing/re-adding cards from the DOM, so re-running a search
     never has to re-fetch or re-render a thumbnail that already loaded. */
  .lib-card.lib-hidden{ display: none; }

  .lib-thumb{
    position: relative;
    display: block;
    aspect-ratio: 4 / 3;
    background:
      radial-gradient(ellipse 80% 70% at 50% 22%, rgba(255,255,255,0.06), transparent 65%),
      var(--bg-panel);
    border-bottom: 1px solid var(--border);
    overflow: hidden;
  }
  /* aspect-ratio fallback for older Safari */
  @supports not (aspect-ratio: 4 / 3){
    .lib-thumb{ height: 0; padding-bottom: 75%; }
  }
  .lib-thumb img{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    /* A cover image fills the tile; a page rendered from the PDF itself is
       portrait, so it is anchored to the top — the title block of the
       first page stays visible instead of being cropped out of frame. */
    object-fit: cover;
    object-position: top center;
    display: block;
    opacity: 0;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .lib-thumb img.ready{ opacity: 1; }
  .lib-card:hover .lib-thumb img.ready{ transform: scale(1.035); }

  /* Placeholder while there is no cover and no rendered page yet. */
  .lib-fallback{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-faint);
  }
  .lib-fallback svg{ width: 46px; height: 46px; opacity: 0.45; }

  .lib-info{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 14px;
    min-height: 58px;
  }
  .lib-text{ min-width: 0; }
  .lib-name{
    display: block;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 13.5px;
    letter-spacing: 0.01em;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .lib-go{
    margin-left: auto;
    flex: 0 0 auto;
    width: 26px; height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    color: var(--ink-faint);
    transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
  }
  .lib-go svg{ width: 15px; height: 15px; }
  .lib-card:hover .lib-go{
    background: var(--accent);
    color: var(--accent-ink);
    transform: translateX(2px);
  }

  @media (max-width: 520px){
    #library-grid{ grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 13px; }
    .lib-info{ padding: 11px 12px; min-height: 52px; }
  }

  @media (prefers-reduced-motion: reduce){
    .lib-card, .lib-thumb img, .lib-go{ transition: none; }
    .lib-card:hover{ transform: none; }
    .lib-card:hover .lib-thumb img.ready{ transform: none; }
  }

  @media (max-width: 560px){
    #library-inner{ padding: 40px 18px 56px; }
    #library-header{ flex-direction: column; align-items: stretch; }
    #library-search-row{ width: 100%; }
  }

  /* ---------- Loading overlay ---------- */
  #loading-overlay{
    /* Fixed to the actual browser viewport rather than absolute within
       #stage: an absolute overlay inherits whatever box #stage happens to
       resolve to, which can end up taller than what's actually visible
       (asymmetric stage padding, viewport-height edge cases, etc.) and
       throw the centered spinner visibly off toward a corner instead of
       the true center of the screen. Fixed positioning is immune to all
       of that — it's always centered on exactly what the user can see. */
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, var(--bg-viewer) 0%, var(--bg-viewer-2) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    z-index: 50;
    transition: opacity 0.4s ease;
  }
  #loading-overlay.hidden{ opacity: 0; pointer-events: none; }
  /* A small open book: two static "page stack" halves (.book-loader-half)
     form the book's silhouette, with 1-2 .book-loader-page layers above
     them that continuously rotate in 3D from lying flat on the right
     stack to lying flat on the left one — a real page turn, not just an
     abstract wobbling rectangle. Multiple page layers, each started at a
     different point in the cycle via animation-delay, keep a page
     mid-flip at almost all times, reading as a book being continuously
     leafed through rather than a single repeating flip. */
  .book-loader{
    width: 64px;
    height: 46px;
    position: relative;
    perspective: 340px;
  }
  .book-loader-half{
    position: absolute;
    top: 4px;
    bottom: 0;
    width: 29px;
    background: var(--page-white);
    box-shadow: 0 5px 14px rgba(0,0,0,0.4);
  }
  .book-loader-half.left{ left: 0; border-radius: 4px 1px 1px 4px; }
  .book-loader-half.right{ right: 0; border-radius: 1px 4px 4px 1px; }
  /* The gap between the two stacks, where a real book's spine/binding
     would sit — also exactly where every flipping page's transform-
     origin is anchored, below. */
  .book-loader-spine{
    position: absolute;
    left: 50%;
    top: 2px;
    bottom: -2px;
    width: 2px;
    transform: translateX(-50%);
    background: var(--bg-viewer-2);
  }
  .book-loader-page{
    position: absolute;
    top: 4px;
    left: 50%;
    width: 29px;
    height: calc(100% - 4px);
    background: linear-gradient(135deg, var(--accent), var(--accent-bright));
    border-radius: 1px 4px 4px 1px;
    /* Anchored at the spine (the shared left edge of both the page and
       the right stack it starts flat against), matching a real book's
       binding — not the element's own center, which would swing the
       page through the spine instead of hinging cleanly at it. */
    transform-origin: left center;
    transform-style: preserve-3d;
    animation: book-page-flip 1.6s cubic-bezier(.6,0,.4,1) infinite;
  }
  .book-loader-page.p2{ animation-delay: -0.8s; }
  @keyframes book-page-flip{
    /* Flat against the right stack (0deg) through to flat against the
       left stack (-180deg) over the first ~40% of the cycle — the
       actual page-turn motion. The two stops immediately after (40% and
       40.01%) both land back at 0deg with no time between them, so the
       page resets to the right stack as an instant, invisible cut
       rather than an animated snap-back; it then sits flat and still
       for the rest of the cycle, ready for its next turn (or, offset by
       animation-delay, for a second page layer to be mid-flip instead —
       see .book-loader-page.p2 above).
    */
    0%{ transform: rotateY(0deg); }
    40%{ transform: rotateY(-180deg); }
    40.01%{ transform: rotateY(0deg); }
    100%{ transform: rotateY(0deg); }
  }
  #loading-text{
    font-family: var(--font-display);
    font-size: 13px;
    color: var(--ink-dim);
    letter-spacing: 0.02em;
  }
  #loading-progress-track{
    width: 200px; height: 3px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    overflow: hidden;
  }
  #loading-progress-bar{
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-bright));
    transition: width 0.25s ease;
  }

  #error-box{
    display: none;
    max-width: 420px;
    text-align: center;
    font-family: var(--font-body);
    color: var(--ink-dim);
    font-size: 13px;
    line-height: 1.6;
  }
  #error-box strong{ color: var(--ink); font-family: var(--font-display); }
  #error-box code{
    background: rgba(255,255,255,0.08);
    padding: 1px 6px;
    border-radius: 4px;
    color: var(--accent-text);
  }

  @media (max-width: 720px){
    #stage{ padding: 60px 16px 90px; }
    #btn-back{ left: 12px; }
    .nav-arrow{ width: 38px; height: 100px; }
    .nav-arrow.prev{ left: 6px; }
    .nav-arrow.next{ right: 6px; }
    /* The "−"/"+" zoom buttons must stay usable on mobile, including
       portrait — only the slider (the widest element in the group, and
       the least practical to drag precisely with a finger) is dropped
       here to keep the toolbar pill from overflowing narrow viewports. */
    #zoom-slider{ display: none; }
    #zoom-group{ gap: 2px; padding: 0; }
    #search-panel{ right: 12px; left: 12px; width: auto; }
    #thumbnail-panel{ width: 94vw; }
  }

  @media (max-width: 380px){
    /* On the narrowest phones, the page indicator's minimum width and
       the toolbar's own gaps/padding are what push the pill wider than
       the viewport — trim those, but the zoom buttons themselves are
       never hidden at any width. */
    #toolbar-inner{ gap: 2px; padding: 6px 6px; }
    .tb-btn{ width: 34px; height: 34px; }
    /* Toolbar row shrinks to 48px here, and so does the button: keep the
       two centres lined up (12 + 24 - 17). */
    #btn-back{ bottom: calc(12px + env(safe-area-inset-bottom, 0px) + 24px - 17px); width: 34px; height: 34px; }
    #btn-back svg{ width: 15px; height: 15px; }
    #page-indicator{ min-width: 0; padding: 0 6px; font-size: 12px; }
    #zoom-value{ display: none; }
    .tb-sep{ margin: 0 2px; }
  }
</style>
</head>
<body>

<div id="app">

  <div id="stage">
    <!-- Kept nested inside #stage for markup convenience, but positioned
         fixed to the full browser viewport (see #loading-overlay's CSS)
         rather than #stage's own box, so it's reliably centered on the
         actual screen the person sees regardless of #stage's size. -->
    <div id="loading-overlay">
      <div class="book-loader" aria-hidden="true">
        <div class="book-loader-half left"></div>
        <div class="book-loader-half right"></div>
        <div class="book-loader-spine"></div>
        <div class="book-loader-page"></div>
        <div class="book-loader-page p2"></div>
      </div>
      <div id="loading-text">Preparando documento…</div>
      <div id="loading-progress-track"><div id="loading-progress-bar"></div></div>
      <div id="error-box">
        <strong id="error-title">No se pudo mostrar el documento</strong><br><br>
        <span id="error-body">Comprueba que existe un archivo llamado <code id="error-pdf-path">documento.pdf</code> en la misma carpeta que <code>index.html</code>, y que el navegador permite ejecutar JavaScript, y vuelve a abrir esta página.</span>
      </div>
    </div>

    <button class="nav-arrow prev" id="btn-prev" aria-label="Página anterior" title="Página anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>

    <div id="book-zoom-sizer">
      <div id="book-zoom-wrap">
        <div id="book"></div>
        <div id="doc-highlight-overlay"></div>
      </div>
    </div>

    <button class="nav-arrow next" id="btn-next" aria-label="Página siguiente" title="Página siguiente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <!-- Thumbnail panel -->
  <div id="thumbnail-panel">
    <h4 id="thumbnail-heading">Miniaturas</h4>
    <div id="thumbnail-grid"></div>
  </div>

  <!-- Search panel -->
  <div id="search-panel">
    <div id="search-input-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search-input" type="text" placeholder="Buscar en el documento…" autocomplete="off">
    </div>
    <div id="search-status">Escribe para buscar</div>
    <div id="search-results"></div>
  </div>

  <!-- Back to the menu: a direct child of #app (not #stage, which clips
       overflow) so it can sit at the same height as the toolbar's icon row
       underneath it. A real link, so middle-click and "open in new tab"
       behave; the href is filled in by the script, which knows how to get
       back to the menu from every URL style the viewer accepts. -->
  <a id="btn-back" href="#" title="Todos los documentos" aria-label="Todos los documentos">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </a>

  <!-- Toolbar -->
  <div id="toolbar">
    <div id="toolbar-inner">
      <button class="tb-btn" id="btn-thumbs" title="Miniaturas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </button>

      <div class="tb-sep"></div>

      <span id="page-indicator"><span id="page-current">1</span> / <span class="total" id="page-total">1</span></span>

      <div class="tb-sep"></div>

      <div id="zoom-group">
        <button class="tb-btn" id="btn-zoom-out" title="Alejar" aria-label="Alejar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <input type="range" id="zoom-slider" min="50" max="250" value="50" step="5">
        <button class="tb-btn" id="btn-zoom-in" title="Acercar" aria-label="Acercar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><line x1="12" y1="5" x2="12" y2="19"/></svg>
        </button>
        <span id="zoom-value">50%</span>
      </div>

      <div class="tb-sep"></div>

      <button class="tb-btn" id="btn-search" title="Buscar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>

      <button class="tb-btn" id="btn-fullscreen" title="Pantalla completa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
    </div>
  </div>

</div>

<!-- Document library — shown instead of the viewer (#app) when index.html
     is opened without a PDF named in the URL (see LIBRARY_MODE in the
     script). Kept as fully separate, sibling markup rather than reusing
     any of #app's own elements, so the two screens never fight over the
     same DOM/CSS state; body.library-mode (see the stylesheet) is the
     only thing that decides which one is actually visible, and that
     class is applied before this script does anything else. -->
<div id="library-screen">
  <div id="library-inner">
    <header id="library-header">
      <h1 id="library-title">Documentos</h1>
      <div id="library-search-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="library-search-input" type="text" placeholder="Buscar documentos…" autocomplete="off">
      </div>
    </header>
    <div id="library-status"></div>
    <div id="library-grid"></div>
  </div>
</div>

  };
  const FALLBACK_LANG = 'en';

  // Reads the device/browser's preferred languages (in priority order,
  // when the browser exposes the full list) and picks the first one this
  // app actually has a dictionary for, matching only the base subtag
  // (e.g. "pt-BR" and "pt-PT" both match "pt") since the UI text itself
  // doesn't vary by region. Anything unsupported — including when the
  // browser doesn't expose a language at all — falls back to English, as
  // requested, rather than silently staying on whatever the markup's
  // static default happened to be.
  function detectLang(){
    try{
      const candidates = (navigator.languages && navigator.languages.length)
        ? navigator.languages
        : [navigator.language || navigator.userLanguage];
      for(const raw of candidates){
        if(!raw) continue;
        const base = String(raw).toLowerCase().split('-')[0];
        if(I18N[base]) return base;
      }
    }catch(err){
      console.error('No se pudo detectar el idioma del dispositivo:', err);
    }
    return FALLBACK_LANG;
  }

  document.documentElement.lang = LANG;

  // then to the key itself (so a typo shows up as visibly-wrong text
  // instead of silently vanishing). {placeholder} tokens in the string
  // are replaced from `vars`.
  function t(key, vars){
    const dict = I18N[LANG] || I18N[FALLBACK_LANG];
    let str = (dict && dict[key]) || (I18N[FALLBACK_LANG] && I18N[FALLBACK_LANG][key]) || key;
    if(vars){
      for(const k in vars){
        str = str.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]);
      }
    }
    return str;
  }

  document.title = t('appTitle');

  // ---------------- PDF path resolution ----------------
  // Lets the viewer be pointed at a specific PDF straight from the URL,
  // e.g. http://localhost:8000/index.html/d.pdf — some static file
  // servers treat everything after the real file (index.html) as extra
  // "path info" and still serve index.html itself, so we read that extra
  // segment back out of location.pathname. Also accepts the PDF name as
  // the final path segment on its own (e.g. a server that rewrites
  // /d.pdf to this page while keeping the original URL) and a ?pdf=
  // query override, in that order. Returns null — rather than guessing a
  // default filename — when none of those actually named a PDF, so the
  // caller can tell "nothing was requested" apart from "this was
  // requested" and show the document library instead of trying (and
  // failing) to open a file nobody asked for.
  function resolvePdfPath(){
    try{
      const path = decodeURIComponent(window.location.pathname);
      // "/index.html/d.pdf" — whatever comes after index.html is the
      // intended filename, but it has to be resolved against the *site
      // root* (not against this fake nested path itself, which is what a
      // plain relative reference would do and just loop back to index.html
      // under most static/SPA-fallback server setups) — a leading "/"
      // makes URL resolution below use the origin instead.
      const afterIndex = path.match(/index\.html?\/(.+\.pdf)$/i);
      if(afterIndex && afterIndex[1]) return '/' + afterIndex[1].replace(/^\/+/, '');

      // A server that rewrites e.g. /d.pdf straight to this page, keeping
      // the original URL in the address bar.
      const trailing = path.match(/\/([^\/]+\.pdf)$/i);
      if(trailing && trailing[1] && !/^index\.html?$/i.test(trailing[1])) return '/' + trailing[1];

      // Explicit override: index.html?pdf=some/other.pdf
      const qp = new URLSearchParams(window.location.search).get('pdf');
      if(qp) return qp;
    }catch(err){
      console.error('No se pudo interpretar la URL para elegir el PDF:', err);

  // the .pdf extension. Used whenever the PDF itself doesn't carry a
  // Title in its metadata (see loadPdf, where that's preferred instead).
  function filenameFromPdfPath(path){
    try{
      const clean = path.split('?')[0].split('#')[0];
      const last = clean.split('/').pop() || '';
      const decoded = decodeURIComponent(last).trim();
      return decoded.replace(/\.pdf$/i, '') || t('genericDocTitle');
    }catch(err){
      return t('genericDocTitle');
    }

  // filenameFromPdfPath's prettified title above) — what the server-side
  // pre-render backend (see loadFromServerManifest) is keyed by.
  function pdfBasename(path){
    try{
      const clean = path.split('?')[0].split('#')[0];
      const last = clean.split('/').pop() || '';
      return decodeURIComponent(last).trim() || 'documento.pdf';
    }catch(err){

    }

  // the old always-a-string shape (falling back to documento.pdf) purely
  // so every existing use of it below — filenameFromPdfPath(PDF_PATH),
  // pdfBasename(PDF_PATH), the error box, new URL(PDF_PATH, ...) — needs
  // no changes at all; none of that code ever actually runs in library
  // mode anyway (see the Boot section), so the fallback value it'd see
  // there is inert.
  const RESOLVED_PDF_PATH = resolvePdfPath();
  const LIBRARY_MODE = RESOLVED_PDF_PATH === null;
  const PDF_PATH = RESOLVED_PDF_PATH || 'documento.pdf';
  // Switches which screen is visible via CSS alone (see body.library-mode
  // in the stylesheet) — done immediately, before anything else in this
  // script touches the DOM, so the viewer's own markup (including its
  // loading spinner, which is otherwise visible by default) never gets a
  // chance to flash on screen first.
  if(LIBRARY_MODE){

  // reasoning — ~288 DPI, print-quality, crisp even at this viewer's max

  // (used only when no backend is available — see loadFromServerManifest)
  // produces the same quality the pre-rendered path would have.
  const RENDER_SCALE = 4.0;
  // Only affects this in-browser fallback path: server-rendered pages are
  // real lossless PNG files on disk (see server.py), but this path holds
  // every page as a data URL in the browser's own memory at once, so a

  // of control on longer documents while still looking effectively

  const JPEG_QUALITY = 0.97;

    bookZoomWrap: document.getElementById('book-zoom-wrap'),

    thumbHeading: document.getElementById('thumbnail-heading'),
    thumbPanel: document.getElementById('thumbnail-panel'),
    thumbGrid: document.getElementById('thumbnail-grid'),
    btnSearch: document.getElementById('btn-search'),
    searchPanel: document.getElementById('search-panel'),

    searchStatus: document.getElementById('search-status'),

    loadingBar: document.getElementById('loading-progress-bar'),
    errorBox: document.getElementById('error-box'),
    errorTitle: document.getElementById('error-title'),
    errorBody: document.getElementById('error-body'),
    libraryTitle: document.getElementById('library-title'),
    btnBack: document.getElementById('btn-back'),
    librarySearchInput: document.getElementById('library-search-input'),
    libraryStatus: document.getElementById('library-status'),
    libraryGrid: document.getElementById('library-grid'),
  };

  let pageFlip = null;
  let totalPages = 0;
  let pageImages = [];         // full-res data URLs, fed straight into loadFromImages()
  let pageTexts = [];          // extracted text per page for search
  let pageTextItems = [];      // per-page array of {str, xPct, yPct, wPct, hPct} for in-document highlighting
  let pageLinkItems = [];      // per-page array of {xPct, yPct, wPct, hPct, kind:'url'|'page', url?, pageIndex?} — PDF link annotations, positioned the same way as pageTextItems
  let aspectRatio = 0.72; // width/height fallback
  let lastRenderedViewport = null;
  let zoomLevel = 0.5; // starts zoomed out to 50% on open
  // Shared with the zoom slider's own min/max attributes (see

  const ZOOM_MIN_PCT = 50;
  const ZOOM_MAX_PCT = 250;
  let currentSearchQuery = '';

  // the DOM — so the interface never briefly shows the markup's hardcoded
  // Spanish before switching to the detected language. Per-item and
  // dynamically-generated text (thumbnail labels, search result counts,
  // loading progress messages, etc.) is translated at the point each is
  // actually generated instead, since it doesn't exist yet at this point.
  function applyTranslations(){
    els.btnPrev.setAttribute('aria-label', t('navPrev'));
    els.btnPrev.setAttribute('title', t('navPrev'));
    els.btnNext.setAttribute('aria-label', t('navNext'));
    els.btnNext.setAttribute('title', t('navNext'));
    els.thumbHeading.textContent = t('thumbnailsLabel');
    els.btnThumbs.setAttribute('title', t('thumbnailsLabel'));
    els.searchInput.setAttribute('placeholder', t('searchPlaceholder'));
    els.searchStatus.textContent = t('searchPromptDefault');
    els.btnZoomOut.setAttribute('title', t('zoomOut'));
    els.btnZoomOut.setAttribute('aria-label', t('zoomOut'));
    els.btnZoomIn.setAttribute('title', t('zoomIn'));
    els.btnZoomIn.setAttribute('aria-label', t('zoomIn'));
    els.btnSearch.setAttribute('title', t('searchButton'));
    els.btnFullscreen.setAttribute('title', t('fullscreenButton'));
    els.errorTitle.textContent = t('errorTitle');
    // The error body embeds two <code> elements (the missing filename,
    // and the fixed "index.html" reference) whose position in the
    // sentence varies by language's word order — built as HTML here
    // rather than split across fixed text nodes, so translations aren't
    // constrained to Spanish's word order.
    const fileCode = '<code id="error-pdf-path">' + escapeHtml(PDF_PATH) + '</code>';
    const indexCode = '<code>index.html</code>';
    els.errorBody.innerHTML = t('errorBody', { file: fileCode, index: indexCode });
    els.loadingText.textContent = t('loadingPreparing');
    els.libraryTitle.textContent = t('libraryTitle');

      els.btnBack.setAttribute('aria-label', t('backToLibrary'));
    }

  }

  function setProgress(pct){ els.loadingBar.style.width = Math.round(pct) + '%'; }

  function showError(){
    setLoadingText('');
    els.loadingBar.parentElement.style.display = 'none';
    document.querySelector('.book-loader').style.display = 'none';
    els.errorBox.style.display = 'block';
  }

  // Shared by both loading paths below (server-manifest and in-browser
  // pdf.js rendering): once pageImages/pageTexts/pageTextItems/
  // pageLinkItems/totalPages/lastRenderedViewport are all populated (by
  // whichever path got there), this inserts the blank spread-balancing
  // filler page if needed, finalizes every internal link's actual
  // flipbook page index, and hands off to initBook(). Kept as one single
  // implementation so the two loading paths can never silently drift
  // out of sync with each other on this shared, easy-to-get-subtly-wrong
  // logic.
  function finalizePagesAndOpenBook(){
    // Keep the first and last page as lone covers, and make sure every page
    // in between can always pair up into a clean two-page spread: if the
    // number of middle pages is odd, insert one blank filler just before
    // the back cover.
    //
    // originalBackCoverPdfIndex tracks the back cover's 0-based PDF page
    // index (matching what pdf.getPageIndex() returns, and what every
    // link's pdfPageIndex above was resolved against) from *before* this
    // possibly shifts it by inserting a page in front of it — needed
    // below to correctly retarget any internal link that points at the
    // back cover.
    const originalBackCoverPdfIndex = totalPages - 1;
    let backCoverWasShifted = false;
    if(totalPages > 2 && (totalPages - 2) % 2 !== 0){
      const blankCanvas = document.createElement('canvas');
      blankCanvas.width = lastRenderedViewport.width;
      blankCanvas.height = lastRenderedViewport.height;
      const bctx = blankCanvas.getContext('2d');
      bctx.fillStyle = '#fbfaf7';
      bctx.fillRect(0, 0, blankCanvas.width, blankCanvas.height);
      const blankUrl = blankCanvas.toDataURL('image/jpeg', JPEG_QUALITY);

      const backCoverImage = pageImages.pop();
      const backCoverText = pageTexts.pop();
      const backCoverItems = pageTextItems.pop();
      const backCoverLinkItems = pageLinkItems.pop();
      pageImages.push(blankUrl, backCoverImage);
      pageTexts.push('', backCoverText);
      pageTextItems.push([], backCoverItems);
      pageLinkItems.push([], backCoverLinkItems);
      totalPages += 1;
      els.pageTotal.textContent = totalPages;
      backCoverWasShifted = true;
    }
