  // gesturechange/gestureend events for a pinch, entirely separately
  // from the standard touch events already handled above — even with
  // touch-action: none and the restrictive viewport meta tag, leaving
  // these unhandled can still let Safari zoom the whole page natively at
  // the same time as the in-app zoom above, fighting it. This is a no-op
  // on every other browser (they simply never fire these events).
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(evt => {
    document.addEventListener(evt, (e) => e.preventDefault());
  });

  // ---------------- Flip dragging vs. pan mode ----------------
  // StPageFlip's own mousedown/touchstart listeners live inside #book
  // (wherever it considers its "distElement"). Whenever the content is
  // actually cropped (see isContentOverflowing above), those are bypassed
  // entirely in favor of pan mode: the press is captured here first and
  // turned into a scroll-based pan instead of ever reaching StPageFlip.
  // Whenever it's NOT cropped, though, a press anywhere on the page — not
  // just a strip along its edges — is left alone to reach StPageFlip's
  // own listener normally, so dragging to turn a page works across the
  // entire page surface.
  //
  // This is done with a capturing-phase listener on #stage — an ancestor
  // of #book — rather than on #book itself, so it always runs *before*
  // the event reaches StPageFlip's own listener, regardless of which of
  // the two was registered first.
  function gateFlipDrag(e){
    if(e.touches && e.touches.length >= 2){
      // Two or more fingers is always a pinch — handled above,
      // regardless of the single-finger pan/flip logic below, and
      // regardless of whether the document currently overflows the
      // viewport (pinch should work at any zoom level).
      e.stopPropagation();
      e.preventDefault();
      startPinch(e);
      return;
    }
    const clientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
    const clientY = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
    if(typeof clientX !== 'number') return;

    // A press landing on a PDF hyperlink — or its enlarged invisible tap
    // target, see .page-link-layer a::before — always wins over both pan-
    // starting below and StPageFlip's own page-flip drag. Without this,
    // panning while zoomed in would otherwise swallow the press before a
    // link ever gets a chance to register a tap: pan mode unconditionally
    // claims every press inside the cropped content area, and a real
    // pan/StPageFlip drag starting under the finger is exactly what makes
    // a link feel unresponsive on a touch device. Letting it through here
    // instead means the press reaches the <a> completely normally —
    // StPageFlip's own click-forwarding (on by default) separately skips
    // starting a page-flip drag for an <a> target too, so together these
    // cover both gestures this viewer can otherwise turn a press into.
    if(e.target && e.target.closest && e.target.closest('.page-link-layer a')) return;

    if(isContentOverflowing()){
      if(e.target && e.target.closest && e.target.closest('.nav-arrow')) return;
      // Stop it here, in the capture phase, before it ever reaches
      // StPageFlip's own listener, then track our own pan drag instead.
      e.stopPropagation();
      if(e.type === 'mousedown' && e.button !== 0) return; // left button only
      e.preventDefault();
      startPan(clientX, clientY);
      return;
    }

    // Pan mode is inactive: leave the press alone so it reaches
    // StPageFlip's own handler and can start a page-turn drag from
    // anywhere on the page, not just its edges.
  }
  els.stage.addEventListener('mousedown', gateFlipDrag, true);
  els.stage.addEventListener('touchstart', gateFlipDrag, true);

  // ---------------- Zoom & Pan ----------------
  // #book-zoom-wrap stays fixed at the "natural" (zoom-independent) book
  // size and is only ever transform-scaled from its top-left corner.
  // #book-zoom-sizer is resized (real width/height, not a transform) to
  // exactly match that scaled footprint, which is what gives #stage's
  // native scrolling a real, correctly-sized box to scroll — guaranteeing
  // every edge of the document stays reachable at any zoom level, instead
  // of silently clipping the side(s) a centered CSS transform would.
  // ---------------- Horizontal auto-recentering ----------------
  // StPageFlip sizes/positions its own internal book element differently
  // depending on orientation — a lone first/last page (portrait) doesn't
  // always end up rendered at the same width, or in the same spot, as a
  // full two-page spread (landscape). Rather than guess at the library's
  // internals, this measures the ACTUAL on-screen box of #book after each
  // render and nudges it (an extra translateX layered onto #book-zoom-
  // wrap's existing transform) so it's always horizontally centered in
  // the stage — whether showing a single cover or a full spread. Because
  // #book-zoom-wrap already CSS-transitions its transform, this nudge
  // animates smoothly rather than snapping into place.
  let bookRecenterX = 0;
  function applyBookTransform(){
    // Previously also carried "scale(zoomLevel)" here, with #book-zoom-
    // wrap's own real width/height staying fixed at the small "natural"
    // (zoom-independent) size and this transform doing the actual visual
    // enlarging. That relied on the browser's compositor re-sampling the
    // full-resolution source image when stretching an already-smaller-
    // than-final-size layer — usually fine, but a CSS transform is
    // fundamentally a *visual* stretch of whatever was laid out and
    // painted underneath, not a request to re-render at a new size.
    // #book-zoom-wrap's real width/height (see applyZoom/animateZoomTo)
    // now already match the current zoom level directly, so the browser
    // always lays out and paints the page images at exactly their final
    // on-screen size, straight from the full-resolution source, on every
    // zoom change — leaving only this translateX (the horizontal
    // recenter nudge, unrelated to zoom) for the transform to do.
    els.bookZoomWrap.style.transform = 'translateX(' + bookRecenterX + 'px)';
  }
  function recenterBookHorizontally(){
    if(!els.book) return;
    // Only meaningful once the document is small enough to be fully
    // visible and centered (see the comment above this function — it
    // exists to correct StPageFlip's own single-cover-vs-spread offset,
    // not to react to panning). Once the document overflows the
    // viewport and the user is actively panning around it, the
    // "currently visible slice" changes with every scroll position, so
    // this correction has nothing stable to measure against — it would
    // read the current pan offset as if it were a rendering error and
    // nudge the whole book sideways by however far the user has panned,
    // which is exactly what silently dragged previously-reachable edges
    // out of range. While overflowing, skip the correction and leave
    // bookRecenterX exactly as it was last computed (from the most
    // recent non-overflowing/centered layout) — panning alone governs
    // the view in that state, consistent with getPanMax()'s bounds,
    // which are computed from #book-zoom-sizer's real box, not this
    // nudge.
    if(isContentOverflowing()) return;
    const bookRect = els.book.getBoundingClientRect();
    if(bookRect.width <= 0) return;
    const stageRect = els.stage.getBoundingClientRect();
    const cs = getComputedStyle(els.stage);
    const padL = parseFloat(cs.paddingLeft);
    const padR = parseFloat(cs.paddingRight);
    const stageContentCenterX = stageRect.left + padL + (stageRect.width - padL - padR) / 2;
    const bookCenterX = (bookRect.left + bookRect.right) / 2;
    // Accumulate against whatever correction is already applied — since
    // this is measuring the *actual* current on-screen position (which
    // already reflects any prior nudge), this naturally converges to 0
    // further adjustment once truly centered.
    bookRecenterX += (stageContentCenterX - bookCenterX);
    applyBookTransform();
  }
  // A single measurement can land mid-transition (CSS width/margin
  // transitions, StPageFlip's own resize), so re-check shortly after
  // things settle in addition to the immediate call. onSettled, if given,
  // fires once the final (260ms) settle pass has actually run — used by
  // the boot sequence to know exactly when the very first spread has
  // finished laying out, not just when this function was *called*.
  function scheduleRecenterBookHorizontally(onSettled){
    // A rapid burst of calls (dragging the zoom slider, pinching) used to
    // leave every earlier call's own "next frame" correction still
    // in-flight when a later call's own correction landed — each reading
    // #book's geometry mid-transition and nudging bookRecenterX off of a
    // stale measurement, then getting immediately second-guessed by the
    // next one. That stacking, not any single measurement, was the
    // visible "vibration": cancelling the previous call's still-pending
    // next-frame pass before starting a new one means only the LATEST
    // call in a burst ever gets to actually apply a correction frame,
    // exactly like the debounce already done for the 260ms settle timer
    // below.
    if(scheduleRecenterBookHorizontally._raf){
      cancelAnimationFrame(scheduleRecenterBookHorizontally._raf);
      scheduleRecenterBookHorizontally._raf = null;
    }
    recenterBookHorizontally();
    scheduleRecenterBookHorizontally._raf = requestAnimationFrame(() => {
      scheduleRecenterBookHorizontally._raf = null;
      recenterBookHorizontally();
    });
    clearTimeout(scheduleRecenterBookHorizontally._t);
    // Every call — whether it passes its own onSettled or not — shares
    // this one debounce timer, so a later bare call (e.g. applyZoom()'s
    // own internal settle-after-zoom call, which fires a frame after
    // this function's caller) would otherwise silently clear and replace
    // an earlier call's still-pending onSettled before it ever runs.
    // That's exactly what left the boot sequence's "hide the loading
    // overlay once the first spread has settled" callback (passed here
    // from initBook()) permanently dropped — the overlay stayed on
    // screen forever because nothing was left to hide it. Keeping
    // whichever onSettled is already outstanding when a call doesn't
    // supply its own means the first caller who asked to be notified
    // still gets notified, no matter how many later bare calls land
    // inside the same debounce window.
    const effectiveOnSettled = onSettled || scheduleRecenterBookHorizontally._pendingOnSettled || null;
    scheduleRecenterBookHorizontally._pendingOnSettled = effectiveOnSettled;
    scheduleRecenterBookHorizontally._t = setTimeout(() => {
      recenterBookHorizontally();
      const cb = scheduleRecenterBookHorizontally._pendingOnSettled;
      scheduleRecenterBookHorizontally._pendingOnSettled = null;
      if(typeof cb === 'function') cb();
    }, 260);
  }

  // ---------------- Zoom anchor tracking ----------------
  // Which natural (zoom-independent) document point a zoom step should
  // keep centered. Starts as null, which every zoom function treats as
  // "the document's own center" — so the very first zoom (before the
  // user has ever panned) behaves exactly as before. Once the user pans
  // #stage to look at some other area, capturing the anchor from the
  // *live* scroll position right before the next zoom change picks up
  // wherever they've panned to, instead of forcing the view back to the
  // document's center. Because every zoom re-centers the view on this
  // same anchor, and pan drags write directly to #stage's scroll
  // position, simply re-reading the scroll position here — right before
  // each zoom — is enough to track "wherever the user last looked",
  // whether that's from panning or from a previous zoom step; no extra
  // bookkeeping in the pan-drag handlers themselves is needed.
  let zoomAnchorNaturalX = null;
  let zoomAnchorNaturalY = null;
  // Where on screen (relative to #stage's own left/top edge — the same
  // coordinate space as els.stage.clientWidth/clientHeight) the anchor
  // point above should be placed once zoom is applied. null means "the
  // viewport's own center", which is what every existing zoom entry
  // point (slider, buttons) wants and is exactly the old, hardcoded
  // behavior. Pinch-to-zoom (below) is the one exception: it points this
  // at wherever the fingers currently are, so the document zooms from
  // under the fingers instead of snapping to center.
  let zoomAnchorOffsetX = null;
  let zoomAnchorOffsetY = null;
  // Shared by every zoom entry point that wants to remember "which
  // natural document point is currently at this on-screen spot" before a
  // zoom change — offsetX/offsetY are in the same stage-relative
  // coordinate space as zoomAnchorOffsetX/Y above (0,0 at the stage's own
  // left/top edge, not the browser viewport's).
  function captureZoomAnchorAtOffset(offsetX, offsetY){
    if(!els.bookZoomSizer || !els.stage || zoomLevel <= 0) return;
    const stageRect = els.stage.getBoundingClientRect();
    if(stageRect.width <= 0 || stageRect.height <= 0) return;
    const stageCs = getComputedStyle(els.stage);
    const padL = parseFloat(stageCs.paddingLeft) || 0;
    const padT = parseFloat(stageCs.paddingTop) || 0;
    const sizerCs = getComputedStyle(els.bookZoomSizer);
    const marginX = parseFloat(sizerCs.marginLeft) || 0;
    const marginY = parseFloat(sizerCs.marginTop) || 0;
    const sizerLeft = padL + marginX;
    const sizerTop = padT + marginY;
    // The extra pan buffer (see computePanExtra/getPanMax) sits between
    // the sizer's own left/top edge and where #book-zoom-wrap — the
    // actually-visible book — starts once the document overflows, so it
    // has to be undone here too, based on the CURRENT on-screen scaled
    // size (currentScaledW/H), before the zoom scale and the horizontal
    // recenter nudge, to land back on a true natural (unscaled) document
    // coordinate.
    const { extraX, extraY } = computePanExtra(currentScaledW, currentScaledH);
    // The given point, in stage-scroll coordinates, converted back into
    // natural (unscaled) book coordinates — undoing both the current
    // zoom scale and the horizontal recenter nudge (bookRecenterX)
    // already baked into what's on screen right now.
    const viewPointX = els.stage.scrollLeft + offsetX;
    const viewPointY = els.stage.scrollTop + offsetY;
    zoomAnchorNaturalX = (viewPointX - sizerLeft - extraX - bookRecenterX) / zoomLevel;
    zoomAnchorNaturalY = (viewPointY - sizerTop - extraY) / zoomLevel;
  }
  function captureZoomAnchorFromScroll(){
    captureZoomAnchorAtOffset(els.stage.clientWidth / 2, els.stage.clientHeight / 2);
  }

  function applyZoom(){
    const { singleW, singleH } = computeBookSize();
    const naturalW = singleW * 2;
    const naturalH = singleH;

    const stageRect = els.stage.getBoundingClientRect();
    const cs = getComputedStyle(els.stage);
    const padL = parseFloat(cs.paddingLeft);
    const padT = parseFloat(cs.paddingTop);
    const padR = parseFloat(cs.paddingRight);
    const padB = parseFloat(cs.paddingBottom);
    const availW = stageRect.width - padL - padR;
    const availH = stageRect.height - padT - padB;

    // Zoom expands/contracts around wherever the user is currently
    // looking: the tracked anchor if they've panned or zoomed before
    // (captureZoomAnchorFromScroll, called by every zoom entry point
    // before this runs), or the document's own center on the very first
    // zoom when nothing has been captured yet.
    const naturalAnchorX = zoomAnchorNaturalX != null ? zoomAnchorNaturalX : naturalW / 2;
    const naturalAnchorY = zoomAnchorNaturalY != null ? zoomAnchorNaturalY : naturalH / 2;
    // Defaults to the viewport's own center (old, hardcoded behavior);
    // pinch-to-zoom points this at the fingers instead — see
    // zoomAnchorOffsetX/Y's own comment above.
    const targetOffsetX = zoomAnchorOffsetX != null ? zoomAnchorOffsetX : els.stage.clientWidth / 2;
    const targetOffsetY = zoomAnchorOffsetY != null ? zoomAnchorOffsetY : els.stage.clientHeight / 2;

    // applyZoom() always jumps *directly* to the current zoomLevel — it's
    // the function behind the zoom slider (which fires many times a
    // second while being dragged), window resizes, and the very first
    // boot-time layout, none of which want an eased animation of their
    // own (only the +/- buttons animate, via animateZoomTo()'s own
    // hand-driven rAF loop below). Left enabled, the sizer/wrap's own CSS
    // transition (width/height/margin/transform, 220ms) would still ease
    // the *visual* size toward the new target on its own schedule while
    // the scroll re-anchor below jumped straight to that target's final
    // position one frame later — two independently-timed motions that,
    // during a slider drag firing every ~16–50ms, stack into a
    // continuous vibration rather than a single clean resize. Disabling
    // the transition and setting size + scroll together, synchronously,
    // removes that mismatch at the source instead of masking it.
    els.bookZoomWrap.style.transition = 'none';
    els.bookZoomSizer.style.transition = 'none';

    // #book-zoom-wrap gets its REAL width/height set directly to the
    // current zoomed size (not a fixed "natural" size stretched via CSS
    // transform — see applyBookTransform's own comment) so the browser
    // always lays out and paints the page images, and StPageFlip's own
    // internal page elements, at exactly their true final on-screen
    // pixel size, straight from the full-resolution source, at every
    // zoom level — the only thing that gives genuinely full-resolution
    // rendering with no ambiguity about what the browser resamples from.
    const scaledW = naturalW * zoomLevel;
    const scaledH = naturalH * zoomLevel;
    els.bookZoomWrap.style.width = scaledW + 'px';
    els.bookZoomWrap.style.height = scaledH + 'px';

    // The extra pan buffer (see computePanExtra/getPanMax) is baked
    // straight into #book-zoom-sizer's own REAL width/height below — not
    // left as just a bigger number in our own clamp math — because the
    // browser only ever honors an assigned scrollLeft/scrollTop up to
    // whatever overflow it can actually see in the DOM; a self-computed
    // bound with nothing physically backing it would just get silently
    // re-clamped back down to the smaller "real" range (the same
    // trailing-padding trap described above, one level up). #book-zoom-
    // wrap — the actually-visible book — is then nudged by (extraX,
    // extraY) within that larger sizer box via its own left/top, so at
    // extraX = extraY = 0 (document fits, or hasn't zoomed in far enough
    // to overflow) it starts out exactly where it always has.
    const { extraX, extraY } = computePanExtra(scaledW, scaledH);
    els.bookZoomWrap.style.left = extraX + 'px';
    els.bookZoomWrap.style.top = extraY + 'px';
    applyBookTransform();

    els.bookZoomSizer.style.width = (scaledW + extraX * 2) + 'px';
    els.bookZoomSizer.style.height = (scaledH + extraY * 2) + 'px';
    currentScaledW = scaledW;
    currentScaledH = scaledH;

    // Center manually within #stage's content box (inside its padding),
    // replicating the old flex-centered look, but as real margin instead
    // of flex alignment — margin never breaks scrollability the way
    // centering an overflowing flex item can. Naturally comes out to 0
    // once the document overflows (scaledW/H alone, without the extra
    // buffer, already exceeds availW/H at that point) — the extra pan
    // buffer is reachable purely by scrolling, not by any extra margin.
    const marginX = Math.max(0, (availW - scaledW) / 2);
    const marginY = Math.max(0, (availH - scaledH) / 2);
    els.bookZoomSizer.style.margin = marginY + 'px ' + marginX + 'px';

    els.zoomValue.textContent = Math.round(zoomLevel * 100) + '%';
    els.zoomSlider.value = Math.round(zoomLevel * 100);
    updatePanAffordance();

    // Make sure StPageFlip's own canvas resolution/geometry is re-measured
    // against the (possibly just-changed) natural book size — otherwise it
    // only re-measures on a genuine window resize event.
    if(pageFlip && pageFlip.getUI){
      const ui = pageFlip.getUI();
      if(ui && ui.update) ui.update();
    }

    // Re-anchor scroll so the tracked point ends up back under the same
    // screen position — computed and applied in this SAME synchronous
    // pass as the size above (not a follow-up rAF) so the two can never
    // visibly land a frame apart, which is what produced the vibration.
    const sizerLeft = padL + marginX;
    const sizerTop = padT + marginY;
    // bookRecenterX is an extra horizontal nudge layered onto
    // #book-zoom-wrap's transform (see applyBookTransform) to correct
    // for StPageFlip rendering a lone portrait page off-center from the
    // full-spread assumption baked into naturalAnchorX. Left out of this
    // calculation, the scroll position gets re-anchored to where the
    // document's center *would* be without that nudge, while the nudge
    // itself shifts what's actually on screen by bookRecenterX more —
    // the mismatch is exactly the sideways jump this accounts for.
    // extraX/extraY (the pan buffer, computed above) sit between the
    // sizer's own edge and where #book-zoom-wrap actually starts — same
    // idea as bookRecenterX, one more offset the real on-screen position
    // includes that the naive sizer-edge-plus-scaled-anchor math doesn't.
    const targetCenterX = sizerLeft + extraX + naturalAnchorX * zoomLevel + bookRecenterX;
    const targetCenterY = sizerTop + extraY + naturalAnchorY * zoomLevel;
    // Computed directly from the document's actual scaled size vs. the
    // stage's real available area (see getPanMax) rather than from
    // stage.scrollWidth/clientWidth, which undercounts the reachable
    // range on the trailing edges once content overflows.
    const { maxX, maxY } = getPanMax(scaledW, scaledH);
    let newScrollLeft = targetCenterX - targetOffsetX;
    let newScrollTop = targetCenterY - targetOffsetY;
    newScrollLeft = Math.max(0, Math.min(maxX, newScrollLeft));
    newScrollTop = Math.max(0, Math.min(maxY, newScrollTop));
    els.stage.scrollLeft = newScrollLeft;
    els.stage.scrollTop = newScrollTop;

    // Restore the transition on the next frame, once this synchronous
    // state has actually been painted — later, unrelated transform
    // changes (the horizontal recenter-on-flip nudge; see
    // recenterBookHorizontally) still animate smoothly as intended,
    // without this zoom update itself ever being subject to that easing.
    //
    // applyZoom() runs many times a second during a slider drag or a
    // pinch (every 'input'/touchmove fires a fresh call), and each call
    // used to queue its OWN independent copy of this restore-and-settle
    // step with nothing cancelling the previous one. Every one of those
    // stale callbacks still fired on a later frame, mid-drag: restoring
    // the transition while the size was already moving on again briefly
    // let the CSS transition animate toward a now-outdated target before
    // the next call's own transition:none took over one frame later —
    // repeated dozens of times during a single drag, that's exactly what
    // read as continuous vibration rather than a clean resize. Cancelling
    // the previous pending restore before queuing a new one means only
    // the most recent call in a burst ever actually restores/settles.
    if(applyZoom._settleRaf){
      cancelAnimationFrame(applyZoom._settleRaf);
      applyZoom._settleRaf = null;
    }
    applyZoom._settleRaf = requestAnimationFrame(() => {
      applyZoom._settleRaf = null;
      els.bookZoomWrap.style.transition = '';
      els.bookZoomSizer.style.transition = '';
      scheduleRecenterBookHorizontally();
    });
  }

  // ---------------- Animated zoom (buttons) ----------------
  // applyZoom() above sets the final state directly and lets #book-zoom-
  // wrap/#book-zoom-sizer's own CSS transition animate the *visual* scale
  // — but it also re-anchors the scroll position in a separate rAF tick,
  // instantly, once. The result is two independently-timed motions at
  // once (a 220ms CSS scale transition vs. an instant scroll snap), which
  // is exactly the "strange movement" a step zoom produced. This instead
  // drives zoomLevel itself through a single rAF loop and recomputes
  // scale *and* scroll together on every frame, so the document's center
  // point never drifts mid-animation.
  let zoomAnimHandle = null;
  function cancelZoomAnimation(){
    if(zoomAnimHandle){ cancelAnimationFrame(zoomAnimHandle); zoomAnimHandle = null; }
    // A slider drag or pinch might have left applyZoom()'s own pending
    // settle-restore callback in flight (see its own comment) right as
    // a button-driven animation takes over — cancel it here too so the
    // two zoom paths can never stack their restores on top of each
    // other.
    if(applyZoom._settleRaf){ cancelAnimationFrame(applyZoom._settleRaf); applyZoom._settleRaf = null; }
  }
  function animateZoomTo(targetPct){
    targetPct = Math.max(ZOOM_MIN_PCT, Math.min(ZOOM_MAX_PCT, Math.round(targetPct)));
    const targetZoom = targetPct / 100;
    if(Math.abs(targetZoom - zoomLevel) < 0.001) return;

    cancelZoomAnimation();

    // Snapshot which natural-space point is currently centered in the
    // viewport (wherever the user has panned to, or the document center
    // if they haven't) before zoomLevel changes below — this is the point
    // the animation will keep centered throughout.
    captureZoomAnchorFromScroll();

    const { singleW, singleH } = computeBookSize();
    const naturalW = singleW * 2;
    const naturalH = singleH;

    const stageRect = els.stage.getBoundingClientRect();
    const cs = getComputedStyle(els.stage);
    const padL = parseFloat(cs.paddingLeft);
    const padT = parseFloat(cs.paddingTop);
    const padR = parseFloat(cs.paddingRight);
    const padB = parseFloat(cs.paddingBottom);
    const availW = stageRect.width - padL - padR;
    const availH = stageRect.height - padT - padB;

    const startZoom = zoomLevel;

    // Anchor point captured once, before the animation starts: wherever
    // the user is currently looking (captureZoomAnchorFromScroll, above),
    // falling back to the document's own center the very first time.
    const naturalAnchorX = zoomAnchorNaturalX != null ? zoomAnchorNaturalX : naturalW / 2;
    const naturalAnchorY = zoomAnchorNaturalY != null ? zoomAnchorNaturalY : naturalH / 2;
    const targetOffsetX = els.stage.clientWidth / 2;
    const targetOffsetY = els.stage.clientHeight / 2;

    // This is driven by hand every frame, so #book-zoom-wrap/#book-zoom-
    // sizer's own CSS transition on these same properties would otherwise
    // fight the rAF loop — each frame interrupting the previous
    // transition partway through, which is exactly the stutter this is
    // meant to fix. Suspend it for the animation's duration.
    els.bookZoomWrap.style.transition = 'none';
    els.bookZoomSizer.style.transition = 'none';

    const DURATION = 260;
    const ease = t => 1 - Math.pow(1 - t, 3); // ease-out cubic
    const t0 = performance.now();

    function frame(now){
      const t = Math.min(1, (now - t0) / DURATION);
      const eased = ease(t);
      zoomLevel = startZoom + (targetZoom - startZoom) * eased;

      // Real width/height set directly to the current animated zoom size
      // every frame (not a fixed "natural" size stretched via transform)
      // — see the matching comment in applyZoom() for why: it's what
      // guarantees the browser is always painting page images at their
      // true final resolution, straight from the full-resolution source,
      // even mid-animation.
      const scaledW = naturalW * zoomLevel;
      const scaledH = naturalH * zoomLevel;
      els.bookZoomWrap.style.width = scaledW + 'px';
      els.bookZoomWrap.style.height = scaledH + 'px';
      // See the matching comment in applyZoom(): the pan buffer has to be
      // baked into the sizer's real box every frame here too (zoomLevel,
      // and therefore how much overflow/buffer applies, changes
      // continuously through the animation), not just computed as a
      // bigger clamp number.
      const { extraX, extraY } = computePanExtra(scaledW, scaledH);
      els.bookZoomWrap.style.left = extraX + 'px';
      els.bookZoomWrap.style.top = extraY + 'px';
      applyBookTransform();

      els.bookZoomSizer.style.width = (scaledW + extraX * 2) + 'px';
      els.bookZoomSizer.style.height = (scaledH + extraY * 2) + 'px';
      currentScaledW = scaledW;
      currentScaledH = scaledH;
      const marginX = Math.max(0, (availW - scaledW) / 2);
      const marginY = Math.max(0, (availH - scaledH) / 2);
      els.bookZoomSizer.style.margin = marginY + 'px ' + marginX + 'px';

      const newSizerLeft = padL + marginX;
      const newSizerTop = padT + marginY;
      // See the matching comment in applyZoom(): bookRecenterX and the
      // pan-buffer offset (extraX/extraY) must be folded into the target
      // center here too, or every animated zoom step re-anchors to a
      // point that ignores nudges already baked into the visible
      // transform/position, producing a sideways drift across the
      // animation instead of a clean zoom-in-place.
      const targetCenterX = newSizerLeft + extraX + naturalAnchorX * zoomLevel + bookRecenterX;
      const targetCenterY = newSizerTop + extraY + naturalAnchorY * zoomLevel;
      // Same computed-bounds approach as applyZoom() — recomputed every
      // frame since scaledW/scaledH change continuously during the
      // animation, keeping the clamp (and therefore the visible motion)
      // exactly in sync with the scale each frame instead of snapping at
      // the end.
      const { maxX, maxY } = getPanMax(scaledW, scaledH);
      let newScrollLeft = targetCenterX - targetOffsetX;
      let newScrollTop = targetCenterY - targetOffsetY;
      newScrollLeft = Math.max(0, Math.min(maxX, newScrollLeft));
      newScrollTop = Math.max(0, Math.min(maxY, newScrollTop));
      els.stage.scrollLeft = newScrollLeft;
      els.stage.scrollTop = newScrollTop;

      els.zoomValue.textContent = Math.round(zoomLevel * 100) + '%';
      els.zoomSlider.value = Math.round(zoomLevel * 100);
      updatePanAffordance();

      if(pageFlip && pageFlip.getUI){
        const ui = pageFlip.getUI();
        if(ui && ui.update) ui.update();
      }

      if(t < 1){
        zoomAnimHandle = requestAnimationFrame(frame);
      }else{
        zoomAnimHandle = null;
        els.bookZoomWrap.style.transition = '';
        els.bookZoomSizer.style.transition = '';
        scheduleRecenterBookHorizontally();
      }
    }
    zoomAnimHandle = requestAnimationFrame(frame);
  }

  function adjustZoom(deltaPct){
    const pct = Math.round(zoomLevel * 100) + deltaPct;
    animateZoomTo(pct);
  }
  els.zoomSlider.addEventListener('input', (e) => {
    cancelZoomAnimation();
    captureZoomAnchorFromScroll();
    zoomLevel = parseInt(e.target.value, 10) / 100;
    applyZoom();
  });
  els.btnZoomIn.addEventListener('click', () => adjustZoom(20));
  els.btnZoomOut.addEventListener('click', () => adjustZoom(-20));

  // ---------------- Thumbnails ----------------
  function buildThumbnails(){
    els.thumbGrid.innerHTML = '';
    // Match the thumbnail frames' proportions to the actual page shape
    // (see .thumb-frame's aspect-ratio) instead of the generic 3:4
    // fallback, so portrait, landscape, or square source documents all
    // get correctly-proportioned thumbnails.
    els.thumbGrid.style.setProperty('--thumb-page-ratio', aspectRatio);
    pageImages.forEach((src, i) => {
      const el = document.createElement('div');
      el.className = 'thumb';
      el.dataset.index = i;

      const frame = document.createElement('div');
      frame.className = 'thumb-frame';
      const img = document.createElement('img');
      img.src = src;
      img.loading = 'lazy';
      img.alt = t('thumbnailAlt', { n: i + 1 });
      frame.appendChild(img);

      const label = document.createElement('span');
      label.textContent = t('pageLabel', { n: i + 1 });

      el.appendChild(frame);
      el.appendChild(label);
      el.addEventListener('click', () => {
        if(pageFlip){ pageFlip.turnToPage(i); renderDocumentHighlights(); }
        closePanels();
      });
      els.thumbGrid.appendChild(el);
    });
    updateThumbActive(0);
  }
  function updateThumbActive(idx){
    const nodes = els.thumbGrid.querySelectorAll('.thumb');
    nodes.forEach(n => n.classList.toggle('current', parseInt(n.dataset.index,10) === idx));
  }

  els.btnThumbs.addEventListener('click', () => {
    const willOpen = !els.thumbPanel.classList.contains('open');
    closePanels();
    if(willOpen){
      els.thumbPanel.classList.add('open');
      els.btnThumbs.classList.add('active');
    }
  });

  // ---------------- In-document highlighting ----------------
  // Instead of injecting markup into StPageFlip's own page elements (which
  // risks disturbing the flip animation), a single overlay layer floats on
  // top of the book and is redrawn to match whichever page(s) are actually
  // visible right now, using the page's own bounding percentages.
  // Keeps the floating highlight overlay pixel-aligned with #book's actual
  // rendered box (StPageFlip sets #book's size itself, and it can change on
  // window resize since we run in "stretch" mode).
  function syncHighlightOverlayBox(){
    els.highlightOverlay.style.left = els.book.offsetLeft + 'px';
    els.highlightOverlay.style.top = els.book.offsetTop + 'px';
    els.highlightOverlay.style.width = els.book.offsetWidth + 'px';
    els.highlightOverlay.style.height = els.book.offsetHeight + 'px';
  }

  function clearDocumentHighlights(){
    els.highlightOverlay.innerHTML = '';
  }

  function getVisiblePages(){
    if(!pageFlip) return [];
    const idx = pageFlip.getCurrentPageIndex();
    const orientation = pageFlip.getOrientation();
    const isSpread = orientation === 'landscape' && idx > 0 && idx < totalPages - 1;
    if(isSpread){
      return [
        { pageIndex: idx,   offsetPct: 0,  widthPct: 50 },
        { pageIndex: idx+1, offsetPct: 50, widthPct: 50 },
      ];
    }
    return [{ pageIndex: idx, offsetPct: 0, widthPct: 100 }];
  }

  function renderDocumentHighlights(){
    clearDocumentHighlights();
    syncHighlightOverlayBox();
    const q = currentSearchQuery.trim().toLowerCase();
    if(!q || q.length < 2 || !pageFlip) return;

    getVisiblePages().forEach(v => {
      const items = pageTextItems[v.pageIndex];
      if(!items) return;
      items.forEach(it => {
        if(!it.str.toLowerCase().includes(q)) return;
        const mark = document.createElement('div');
        mark.className = 'hl-mark';
        mark.style.left = (v.offsetPct + (it.xPct / 100) * v.widthPct) + '%';
        mark.style.top = it.yPct + '%';
        mark.style.width = ((it.wPct / 100) * v.widthPct) + '%';
        mark.style.height = it.hPct + '%';
        els.highlightOverlay.appendChild(mark);
      });
    });
  }

  // ---------------- Search ----------------
  function runSearch(query){
    els.searchResults.innerHTML = '';
    currentSearchQuery = query || '';
    renderDocumentHighlights();
    if(!query || query.trim().length < 2){
      els.searchStatus.textContent = t('searchPromptDefault');
      return;
    }
    const q = query.trim().toLowerCase();
    let hits = 0;
    pageTexts.forEach((text, i) => {
      const lower = text.toLowerCase();
      const idx = lower.indexOf(q);
      if(idx !== -1){
        hits++;
        const start = Math.max(0, idx - 40);
        const end = Math.min(text.length, idx + q.length + 60);
        let snippet = (start > 0 ? '…' : '') + text.slice(start, end) + (end < text.length ? '…' : '');
        const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
        snippet = escapeHtml(snippet).replace(re, '<mark>$1</mark>');

        const item = document.createElement('div');
        item.className = 'search-hit';
        item.innerHTML = '<span class="hp">' + escapeHtml(t('pageLabel', { n: i + 1 })) + '</span><span class="hs">' + snippet + '</span>';
        item.addEventListener('click', () => {
          if(pageFlip){ pageFlip.turnToPage(i); renderDocumentHighlights(); }
        });
        els.searchResults.appendChild(item);
      }
    });
    els.searchStatus.textContent = hits
      ? (hits === 1 ? t('searchResultsOne') : t('searchResultsOther', { n: hits }))
      : t('searchNoResults');
  }
  function escapeHtml(str){
    return str.replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  let searchDebounce;
  els.searchInput.addEventListener('input', (e) => {
    clearTimeout(searchDebounce);
    const val = e.target.value;
    searchDebounce = setTimeout(() => runSearch(val), 180);
  });

  // Shared by the toolbar search button (toggles) and the Ctrl/Cmd+F
  // shortcut (always opens/focuses, matching native find-bar behavior —
  // pressing it again while already open just re-focuses and re-selects
  // the query instead of closing the panel).
  function openSearchPanel(){
    closePanels();
    els.searchPanel.classList.add('open');
    els.btnSearch.classList.add('active');
    setTimeout(() => { els.searchInput.focus(); els.searchInput.select(); }, 50);
  }
  els.btnSearch.addEventListener('click', () => {
    const willOpen = !els.searchPanel.classList.contains('open');
    if(willOpen){
      openSearchPanel();
    } else {
      closePanels();
    }
  });

  function closePanels(){
    const wasSearchOpen = els.searchPanel.classList.contains('open');
    els.thumbPanel.classList.remove('open');
    els.searchPanel.classList.remove('open');
    els.btnThumbs.classList.remove('active');
    els.btnSearch.classList.remove('active');
    if(wasSearchOpen){
      currentSearchQuery = '';
      clearDocumentHighlights();
    }
  }

  document.addEventListener('click', (e) => {
    const inThumb = els.thumbPanel.contains(e.target) || els.btnThumbs.contains(e.target);
    const inSearch = els.searchPanel.contains(e.target) || els.btnSearch.contains(e.target);
    if(!inThumb && !inSearch){ closePanels(); }
  });

  // ---------------- Fullscreen ----------------
  els.btnFullscreen.addEventListener('click', () => {
    if(!document.fullscreenElement){
      document.getElementById('app').requestFullscreen().catch(()=>{});
    } else {
      document.exitFullscreen();
    }
  });
  document.addEventListener('fullscreenchange', () => {
    els.btnFullscreen.classList.toggle('active', !!document.fullscreenElement);
    // Entering/exiting fullscreen changes #stage's on-screen box immediately;
    // the fixed nav arrows need to re-sync to its new vertical center.
    positionNavArrows();
  });

  // ---------------- Resize ----------------
  // StPageFlip's "stretch" size mode has autoSize enabled by default, so it
  // already re-measures its container on window resize. We just keep the
  // nav-arrow enabled/disabled state, position, and thumbnail highlight in
  // sync.
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if(!pageFlip) return;
      // The natural book size depends on #stage's available space, so a
      // window resize needs to recompute it — applyZoom() re-derives it
      // from computeBookSize() every time it runs. The text layer's
      // font-size is expressed as calc(var(--natural-page-h) * fraction),
      // so refresh that variable too or text would go stale relative to
      // the new page size.
      updateNaturalPageHeightVar();
      applyZoom();
      updateNavArrows();
      positionNavArrows();
      updatePageIndicator();
      renderDocumentHighlights();
    }, 200);
  });

  // ---------------- Document library ----------------
  // Only ever runs when LIBRARY_MODE is true (see the Boot section below)
  // — i.e. index.html was opened with no PDF named in the URL at all.
  // Lists every PDF in the same server folder as index.html, with a
  // thumbnail and filename per document; clicking one just navigates to
  // ?pdf=<file>, which resolvePdfPath() already knows how to open (see
  // its own comment) — the existing viewer is otherwise completely
  // untouched by any of this.

  // A generic document-shaped icon shown in place of a thumbnail while
  // one is still loading, or if it never manages to produce one (e.g. a
  // corrupt PDF, or a slow/unavailable network) — so a failed thumbnail
  // never leaves a card silently blank.
  const LIB_PLACEHOLDER_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';

  // The "open" arrow in each card's footer row.
  const LIB_ARROW_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="M12 5l7 7-7 7"/></svg>';

  // ---- Cover images -------------------------------------------------
  // A cover picture dropped in thumbnails/ next to index.html always wins
  // over anything rendered from the PDF itself: it is one plain image
  // request, needs no pdf.js work at all, and lets someone choose a nicer
  // opening image than whatever page 1 happens to look like.
  //
  // For documento.pdf, all of these are tried in order:
  //   thumbnails/documento.png .jpg .jpeg .webp .avif
  //   thumbnails/documento.pdf.png .jpg .jpeg .webp .avif
  // — the second set is for anyone who names the image after the whole
  // filename rather than just its stem.
  const LIB_THUMB_DIR = 'thumbnails/';
  const LIB_THUMB_EXT = ['png', 'jpg', 'jpeg', 'webp', 'avif'];

  // Comparison key for a filename: lowercased, accents removed, extension
  // dropped (both "informe.png" and "informe.pdf.png" reduce to the same
  // thing), and every space/underscore/hyphen/dot squeezed out. This is
  // what makes "Projekt_25.pdf" find "Projekt 25.png", and "informe.pdf"
  // find "Informe.PNG" — the mismatches that otherwise look like the
  // feature is simply broken.
  function thumbKey(name){
    return String(name)
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/\.(png|jpe?g|webp|avif)$/, '')
      .replace(/\.pdf$/, '')
      .replace(/[\s_\-.]+/g, '');
  }

  // Read once, shared by every card: if the server will list thumbnails/
  // (Apache autoindex, nginx autoindex, `python3 -m http.server`, ...),
  // one request gives the real name of every cover in there, and matching
  // becomes exact instead of guesswork. Servers that refuse to list the
  // folder just yield an empty index and the probing below takes over.
  let thumbIndexPromise = null;
  function loadThumbIndex(){
    if(thumbIndexPromise) return thumbIndexPromise;
    thumbIndexPromise = (async () => {
      const index = new Map();
      try{
        const dirUrl = new URL(LIB_THUMB_DIR, window.location.href).href;
        const res = await fetch(dirUrl);
        if(!res.ok) return index;
        const html = await res.text();
        // Same guard as discoverLibraryDocuments: a server answering a
        // folder request with an index.html is not a directory listing.
        if(/id=["']app["']/.test(html)) return index;
        const doc = new DOMParser().parseFromString(html, 'text/html');
        doc.querySelectorAll('a[href]').forEach(a => {
          const href = a.getAttribute('href') || '';
          if(!/\.(png|jpe?g|webp|avif)(?:[?#].*)?$/i.test(href)) return;
          try{
            const abs = new URL(href, dirUrl);
            const name = decodeURIComponent(abs.pathname.split('/').pop() || '');
            if(name && !index.has(thumbKey(name))) index.set(thumbKey(name), abs.href);
          }catch(e){ /* unparseable href — skip it */ }
        });
      }catch(err){ /* folder not listable — probing below handles it */ }
      return index;
    })();
    return thumbIndexPromise;
  }

  // Does this URL actually decode as an image? Probed with Image() rather
  // than fetch so a missing file is a plain 404 the browser handles
  // quietly, with no CORS requirements of any kind.
  function imageExists(url){
    return new Promise(resolve => {
      const probe = new Image();
      probe.onload = () => resolve(!!probe.naturalWidth);
      probe.onerror = () => resolve(false);
      probe.src = url;
    });
  }

  // Every name/extension pair worth trying when the folder can't be
  // listed. Underscore/space variants are included because covers are
  // routinely named the readable way ("Projekt 25.png") while the PDF
  // keeps the underscore ("Projekt_25.pdf"), and vice versa.
  function coverCandidates(entry){
    const base = String(entry.file).split('?')[0].split('#')[0].split('/').pop() || '';
    const stem = base.replace(/\.pdf$/i, '');
    const names = [];
    const addName = n => { if(n && names.indexOf(n) === -1) names.push(n); };
    addName(stem);
    addName(stem.replace(/_/g, ' '));
    addName(stem.replace(/\s+/g, '_'));
    addName(entry.title);
    addName(base);   // covers named after the whole filename: informe.pdf.png

    const urls = [];
    const rel = name => new URL(LIB_THUMB_DIR + name, window.location.href).href;
    for(const name of names){
      for(const ext of LIB_THUMB_EXT){
        urls.push(rel(name + '.' + ext));
        urls.push(rel(name + '.' + ext.toUpperCase()));
      }
    }
    return urls;
  }

  // The cover for one document, or null when there isn't one:
  //   1. an explicit "thumb" path in library.json, if the entry has one;
  //   2. a name match against the listing of thumbnails/, when available;
  //   3. otherwise, probing the candidate names above one by one.
  async function findCoverImage(entry){
    if(entry.thumb){
      const explicit = new URL(entry.thumb, window.location.href).href;
      if(await imageExists(explicit)) return explicit;
    }

    try{
      const index = await loadThumbIndex();
      if(index.size){
        const base = String(entry.file).split('/').pop() || '';
        const hit = index.get(thumbKey(base)) || index.get(thumbKey(entry.title));
        if(hit) return hit;
      }
    }catch(err){ /* fall through to probing */ }

    for(const url of coverCandidates(entry)){
      if(await imageExists(url)) return url;
    }
    return null;
  }

  // Strategy 1: an optional backend endpoint (see server.py, alongside
  // this file) that returns an authoritative file listing, e.g.
  // { documents: ["a.pdf", "b.pdf"] } — tried first since, when present,
  // it's reliable regardless of what the static file server itself does.
  //
  // Strategy 2: a plain static library.json file living right next to
  // index.html — either a bare array (["a.pdf","b.pdf"]) or the same
  // { documents: [...] } shape strategy 1 uses. This is the one truly
  // reliable option with zero server-side setup: it works identically on
  // every static host (GitHub Pages, S3, Netlify, a plain `python3 -m
  // http.server`, ...) with nothing more than a JSON file someone
  // maintains by hand or regenerates with a one-liner such as
  // `python3 -c "import json,glob;json.dump({'documents':sorted(glob.glob('*.pdf'))},open('library.json','w'))"`.
  //
  // Strategy 3 (last resort): ask the static file server for a directory
  // listing of the folder index.html lives in — works with genuine
  // autoindex-style servers (Apache "Options +Indexes", nginx
  // "autoindex on", a bare file server with no index.html precedence).
  // IMPORTANT caveat this exists specifically to work around: on the
  // overwhelmingly common setup — index.html sitting in the very folder
  // being listed — a GET on that folder is answered by literally every
  // mainstream static server (Python's http.server, Apache, nginx, ...)
  // with index.html itself, because that's what "index" files are for;
  // it is NOT a directory listing. That response is detected below (it
  // contains this app's own #app markup) and skipped rather than
  // "successfully" parsed into zero results, which is exactly why this
  // strategy alone previously found nothing on the setup it's actually
  // meant to serve. Parsed with DOMParser (when it does get real
  // autoindex HTML back) rather than a regex, so a given server's exact
  // markup (attribute order/quoting, extra chrome) doesn't matter — only
  // real anchor elements are read, and DOMParser never executes anything
  // in the page it parses.
  // Accepts every shape an entry can take, in library.json or from either
  // of the other two strategies: a plain string ("informe.pdf") or an
  // object ({ "file": "informe.pdf", "title": "Informe anual",
  // "thumb": "portadas/informe.jpg" }). Anything that isn't a PDF, or has
  // no filename at all, is dropped.
  function normaliseDoc(raw){
    const entry = (typeof raw === 'string')
      ? { file: raw }
      : (raw && typeof raw === 'object' ? Object.assign({}, raw) : null);
    if(!entry || !entry.file) return null;
    entry.file = String(entry.file).replace(/^\.?\//, '');
    if(!/\.pdf$/i.test(entry.file)) return null;
    if(!entry.title) entry.title = filenameFromPdfPath(entry.file);
    return entry;
  }

  function normaliseDocList(list){
    const out = [];
    for(const raw of list){
      const entry = normaliseDoc(raw);
      if(entry) out.push(entry);
    }
    return out;
  }

  async function discoverLibraryDocuments(){
    try{
      const res = await fetch('/api/library');
      if(res.ok){
        const data = await res.json();
        const files = Array.isArray(data && data.documents) ? data.documents : null;
        if(files && files.length){
          const list = normaliseDocList(files);
          if(list.length) return list;
        }
      }
    }catch(err){ /* no backend running — fall through to strategy 2 */ }

    try{
      // Resolved relative to index.html's OWN url (not an absolute
      // site-root path) so this still finds library.json correctly when
      // index.html is deployed inside a subfolder, matching how PDF
      // filenames themselves are already resolved (see resolvePdfPath).
      const manifestUrl = new URL('library.json', window.location.href).href;
      const res = await fetch(manifestUrl);
      if(res.ok){
        const data = await res.json();
        const files = Array.isArray(data) ? data : (Array.isArray(data && data.documents) ? data.documents : null);
        if(files && files.length){
          const list = normaliseDocList(files);
          if(list.length) return list;
        }
      }
    }catch(err){ /* no library.json present — fall through to strategy 3 */ }

    try{
      const dirUrl = new URL('.', window.location.href).href;
      const res = await fetch(dirUrl);
      if(res.ok){
        const html = await res.text();
        // See this function's own comment above: on the setup this
        // whole feature targets, this response IS index.html (the
        // server's own index-file fallback for a bare directory
        // request), not a real directory listing — recognizable by
        // containing this exact app's #app markup. Bail out here rather
        // than "successfully" parsing it into zero <a href="*.pdf">
        // matches, so the failure is explicit instead of silently
        // indistinguishable from "the folder is genuinely empty."
        if(/id=["']app["']/.test(html)){
          throw new Error('directory request was answered with index.html itself, not a listing');
        }
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const names = new Set();
        doc.querySelectorAll('a[href]').forEach(a => {
          const href = a.getAttribute('href') || '';
          if(!/\.pdf(?:[?#].*)?$/i.test(href)) return;
          try{
            const abs = new URL(href, dirUrl);
            const rel = decodeURIComponent(abs.pathname.split('/').pop() || '');
            if(rel) names.add(rel);
          }catch(e){ /* unparseable href — skip it */ }
        });
        if(names.size) return normaliseDocList(Array.from(names));
      }
    }catch(err){ /* directory listing unavailable either */ }

    return [];
  }

  // Thumbnail for one document, cheapest option first:
  //  0. A cover image sitting in thumbnails/ (see findCoverImage above) —
  //     a single plain image request, and the only option someone can
  //     choose by hand, so it wins over every rendered alternative.
  //  1. An already pre-rendered static manifest (see prerender_all.py /
  //     loadFromServerManifest above) — reuse its first page image
  //     directly instead of asking the browser to render anything.
  //  2. A live backend render (same /api/manifest endpoint the viewer
  //     itself uses) — still just reads its first page.
  //  3. Render page 1 client-side with pdf.js at a small scale — cheap
  //     enough to do per card (nothing like the full-document render the
  //     actual viewer does) and needs no backend at all.
  // Returns null (caller keeps the placeholder icon) if every option
  // fails — a slow or broken document should never block the rest of
  // the grid from rendering.
  async function getLibraryThumbnail(entry){
    const filename = entry.file;
    // 0. A cover image in thumbnails/ — cheapest of all, and the one the
    //    person controls directly, so it takes priority over every render.
    try{
      const cover = await findCoverImage(entry);
      if(cover) return cover;
    }catch(err){ /* no cover for this document — carry on */ }

    // 1. Page 1 of the pre-rendered pages — the same
    //    pages/<documento>/manifest.json the viewer itself opens, found
    //    and resolved by the exact same helpers, so a cover can never
    //    disagree with what opening the card actually shows.
    try{
      const found = await fetchStaticManifest(filename);
      if(found && found.manifest.pages[0].image){
        return resolveManifestAsset(found.manifest.pages[0].image, found.url);
      }
    }catch(err){ /* not pre-rendered — try the next strategy */ }

    try{
      const res = await fetch('/api/manifest?pdf=' + encodeURIComponent(pdfBasename(filename)));
      if(res.ok){
        const manifest = await res.json();
        if(isUsableManifest(manifest) && manifest.pages[0].image){
          return resolveManifestAsset(manifest.pages[0].image, null);
        }
      }
    }catch(err){ /* no backend running — try the next strategy */ }

    try{
      const url = new URL(filename, window.location.href).href;
      const pdf = await pdfjsLib.getDocument(url).promise;
      const page = await pdf.getPage(1);
      const THUMB_SCALE = 0.35;
      const viewport = page.getViewport({ scale: THUMB_SCALE });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      canvas.width = 0; canvas.height = 0; // free canvas memory
      return dataUrl;
    }catch(err){
      return null;
    }
  }

  async function initLibrary(){
    els.libraryStatus.textContent = t('libraryLoading');
    const files = await discoverLibraryDocuments();

    if(!files.length){
      els.libraryStatus.textContent = t('libraryEmpty');
      return;
    }
    els.libraryStatus.textContent = '';

    // Filename shown immediately for every card; each thumbnail is then
    // fetched/rendered independently and swapped in whenever it's ready,
    // so one slow or broken document never delays the rest of the grid.
    const cards = files
      .slice()
      .sort((a, b) => a.title.localeCompare(b.title, undefined, { sensitivity: 'base' }))
      .map(entry => {
        const file = entry.file;
        const title = entry.title;

        const card = document.createElement('a');
        card.className = 'lib-card';
        card.href = '?pdf=' + encodeURIComponent(file);
        // Both are searchable, since the title shown on the card and the
        // filename behind it don't have to be the same text.
        card.dataset.filename = (file + ' ' + title).toLowerCase();

        const thumb = document.createElement('div');
        thumb.className = 'lib-thumb';
        thumb.innerHTML = '<span class="lib-fallback">' + LIB_PLACEHOLDER_ICON + '</span>';

        const info = document.createElement('div');
        info.className = 'lib-info';
        info.innerHTML =
          '<span class="lib-text"><span class="lib-name"></span></span>' +
          '<span class="lib-go">' + LIB_ARROW_ICON + '</span>';
        info.querySelector('.lib-name').textContent = title;

        card.appendChild(thumb);
        card.appendChild(info);
        els.libraryGrid.appendChild(card);

        getLibraryThumbnail(entry).then(src => {
          if(!src) return;
          const img = document.createElement('img');
          img.alt = t('libraryThumbAlt', { file: title });
          // Faded in by CSS only once it has actually decoded, so a cover
          // that 404s or a broken render never replaces the placeholder
          // with an empty box.
          img.onload = () => { img.className = 'ready'; };
          img.src = src;
          thumb.appendChild(img);
        }).catch(() => { /* keep the placeholder icon */ });

        return card;
      });

    els.librarySearchInput.addEventListener('input', () => {
      const q = els.librarySearchInput.value.trim().toLowerCase();
      let visible = 0;
      cards.forEach(card => {
        const matches = !q || card.dataset.filename.includes(q);
        card.classList.toggle('lib-hidden', !matches);
        if(matches) visible++;
      });
      els.libraryStatus.textContent = (q && visible === 0) ? t('libraryNoResults', { query: els.librarySearchInput.value.trim() }) : '';
    });
  }

  // Where the menu lives, seen from a page that is currently showing a
  // document. Mirrors resolvePdfPath's three URL styles in reverse: strip
  // whatever names the PDF, and what's left is the menu.
  function libraryHref(){
    const path = window.location.pathname;
    const afterIndex = path.match(/^(.*index\.html?)\/.+\.pdf$/i);
    if(afterIndex) return afterIndex[1];
    const trailing = path.match(/^(.*\/)[^\/]+\.pdf$/i);
    if(trailing) return trailing[1];
    return path;   // ?pdf= : dropping the query is enough
  }

  // ---------------- Boot ----------------
  if(LIBRARY_MODE){
    initLibrary();
  } else {
    // The corner link gets a real href rather than a click handler, so
    // middle-click and ctrl/cmd-click still open the menu in a new tab.
    const backLink = document.getElementById('btn-back');
    if(backLink) backLink.href = libraryHref();
    applyZoom(); // reflect the 50% default zoom immediately
    positionNavArrows();
    loadPdf();
  }

})();
</script>
</body>
</html>
