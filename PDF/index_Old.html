    // totalPages (and whether the back cover got shifted, above) is
    // settled: a link's pdfPageIndex only needs the +1 correction when it
    // pointed at exactly the page that moved; every other link's index is
    // unaffected by the filler insertion and carries over as-is.
    pageLinkItems.forEach(items => {
      items.forEach(item => {
        if(item.kind !== 'page') return;
        item.pageIndex = (backCoverWasShifted && item.pdfPageIndex === originalBackCoverPdfIndex)
          ? item.pdfPageIndex + 1
          : item.pdfPageIndex;
      });
    });

    setProgress(100);
    setLoadingText(t('loadingOpeningBook'));
    setTimeout(initBook, 200);
  }

  // ---------------- Pre-rendered pages ----------------
  // The normal way a document opens: every page was already rendered to
  // an image ahead of time into pages/<documento>/, together with a
  // manifest.json holding the text, links and page size this viewer
  // needs. Opening a document is then just fetching that manifest and
  // showing the images — no pdf.js, no rendering work, identical cost on
  // every visit. Rendering the PDF in-browser still exists below, but
  // only as the fallback for a document nobody pre-rendered yet.
  //
  // Returns true if a manifest was loaded from any source below (caller
  // should stop — pageImages/etc. are already populated and
  // finalizePagesAndOpenBook() has already run), or false if none was
  // present/valid, so the caller can fall back to pdf.js exactly as
  // before, keeping this file fully functional on its own.

  // The folder holding the pre-rendered pages, relative to index.html.
  // One subfolder per document inside it. Change this single string if
  // that folder is ever renamed.
  const PAGES_DIR = 'pages/';

  // The folder index.html itself is served from — what every static
  // asset here hangs off. Computed from the current URL rather than
  // hardcoded to "/", so the whole site keeps working when it's deployed
  // inside a subfolder (project.github.io/visor/, a shared host's
  // /docs/, ...) instead of at the domain root. libraryHref() already
  // knows how to strip whatever names the PDF out of any of the three
  // URL styles resolvePdfPath accepts; '.' then drops index.html itself.
  let siteBaseUrlCache = null;
  function siteBaseUrl(){
    if(siteBaseUrlCache) return siteBaseUrlCache;
    try{
      siteBaseUrlCache = new URL('.', new URL(libraryHref(), window.location.href)).href;
    }catch(err){
      siteBaseUrlCache = new URL('.', window.location.href).href;
    }
    return siteBaseUrlCache;
  }

  // Every folder name worth trying inside pages/ for one document, best
  // guess first. safeSlug's form comes first because that's what the
  // pre-render script itself writes, but a folder named exactly like the
  // document ("Informe anual/") is what someone doing it by hand tends
  // to create, and space/underscore variants are the usual near-misses
  // between the two — so all of them are accepted rather than silently
  // falling back to a full in-browser render over a naming detail.
  function pagesFolderCandidates(pdfPath){
    const base = pdfBasename(pdfPath);
    const stem = base.replace(/\.pdf$/i, '');
    const names = [];
    const add = n => { if(n && names.indexOf(n) === -1) names.push(n); };
    add(safeSlug(base));              // Informe_anual
    add(stem);                        // Informe anual
    add(stem.replace(/\s+/g, '_'));
    add(stem.replace(/_/g, ' '));
    add(base);                        // Informe anual.pdf
    return names;
  }

  // Turns whatever a manifest says an image is into a URL that actually
  // resolves here. Three shapes are accepted, because they're all things
  // a pre-render script legitimately writes:
  //   - a full URL or data: URI      — used as-is;
  //   - "001.png"                    — relative to the manifest's own
  //                                    folder, the natural reading;
  //   - "/pages/doc/001.png"         — a site-root path from a script
  //                                    that assumed the domain root.
  // That last one is the one worth care: taken literally it breaks the
  // moment the site lives in a subfolder, so everything from pages/
  // onwards is kept and re-anchored onto the real base instead.
  function resolveManifestAsset(raw, manifestUrl){
    const value = String(raw == null ? '' : raw);
    if(!value) return value;
    if(/^(?:https?:|data:|blob:)/i.test(value)) return value;
    try{
      if(value.charAt(0) === '/'){
        const marker = value.indexOf('/' + PAGES_DIR);
        const rel = marker !== -1 ? value.slice(marker + 1) : value.replace(/^\/+/, '');
        return new URL(rel, siteBaseUrl()).href;
      }
      return new URL(value, manifestUrl || siteBaseUrl()).href;
    }catch(err){
      return value;
    }
  }

  // Looks for pages/<documento>/manifest.json, trying each candidate
  // folder name above in turn. Returns { manifest, url } — the url is
  // what the image paths inside get resolved against — or null when the
  // document simply hasn't been pre-rendered.
  async function fetchStaticManifest(pdfPath){
    for(const name of pagesFolderCandidates(pdfPath)){
      try{
        const url = new URL(PAGES_DIR + encodeURIComponent(name) + '/manifest.json', siteBaseUrl()).href;
        const res = await fetch(url);
        if(!res.ok) continue;
        const manifest = await res.json();
        if(isUsableManifest(manifest)) return { manifest, url };
      }catch(err){ /* missing, or not JSON — try the next candidate */ }
    }
    return null;
  }

  // Populates the shared page arrays from a manifest object — used by
  // both loading strategies below, whichever one actually finds data,
  // so they can never drift out of sync on this shared logic.
  function applyServerManifest(manifest, manifestUrl){
    totalPages = manifest.pages.length;
    els.pageTotal.textContent = totalPages;
    aspectRatio = manifest.aspectRatio || aspectRatio;
    document.title = manifest.title || filenameFromPdfPath(PDF_PATH);
    lastRenderedViewport = { width: manifest.pageWidthPx, height: manifest.pageHeightPx };

    manifest.pages.forEach(p => {
      // resolveManifestAsset turns p.image into a real, directly-
      // fetchable URL whichever of its accepted shapes the manifest
      // used (see its own comment) — an <img src> doesn't care whether
      // that ends up being a data URL or a normal one, so
      // buildPageElements() needs no changes at all to consume either.
      pageImages.push(resolveManifestAsset(p.image, manifestUrl));
      pageTexts.push(p.text || '');
      pageTextItems.push(p.textItems || []);
      // The backend names the internal-link field pageIndex (a plain
      // 0-based *PDF* page index — it has no notion of this viewer's own
      // blank-filler spread-balancing, see finalizePagesAndOpenBook), so
      // it's remapped here to pdfPageIndex to match exactly what the pdf.
      // js-based path below produces, letting both paths share that same
      // finalization function unchanged.
      pageLinkItems.push((p.linkItems || []).map(li => (
        li.kind === 'page' ? { ...li, pdfPageIndex: li.pageIndex } : li
      )));
    });

    finalizePagesAndOpenBook();
  }
  function isUsableManifest(manifest){
    return !!manifest && Array.isArray(manifest.pages) && manifest.pages.length > 0;
  }
  // Mirrors the backend's own safe_slug() (see server.py) exactly, so the
  // same PDF filename always maps to the same pages/<slug>/ folder on
  // both sides — needed by the static-file loading strategy below, which
  // has to guess that folder name itself instead of asking a backend to
  // resolve it.
  function safeSlug(filename){
    let name = (filename || '').split('/').pop().split('\\').pop() || '';
    name = name.replace(/\.pdf$/i, '');
    name = name.replace(/[^A-Za-z0-9._-]+/g, '_').replace(/^[._]+|[._]+$/g, '');
    return name || 'document';
  }
  async function loadFromServerManifest(pdfFileName){
    setLoadingText(t('loadingPreparing'));

    // Strategy 1: the pre-rendered pages/<documento>/manifest.json, read
    // as a plain static file with no backend involved at all. This is
    // the normal path and it's deliberately first: the pages are already
    // sitting there, so asking anything else before reading them would
    // only add a wasted round trip to every single document open.
    try{
      const found = await fetchStaticManifest(pdfFileName);
      if(found){
        applyServerManifest(found.manifest, found.url);
        return true;
      }
    }catch(err){ /* not pre-rendered — fall through to strategy 2 */ }

    // Strategy 2: the optional Flask backend (server.py), for documents
    // that were never pre-rendered — it renders one on first request and
    // caches it. Does nothing at all unless that backend is running.
    try{
      const res = await fetch('/api/manifest?pdf=' + encodeURIComponent(pdfFileName));
      if(res.ok){
        const manifest = await res.json();
        if(isUsableManifest(manifest)){
          applyServerManifest(manifest, null);
          return true;
        }
      }
    }catch(err){ /* no backend running either */ }

    return false;
  }

  // ---------------- Load & render PDF ----------------
  // Resolves a PDF link annotation's destination (either a named
  // destination string, or an already-explicit destination array — see
  // pdf.js's own Annotation/getAnnotations docs for why it can be either)
  // down to a plain 0-based PDF page index, the same indexing
  // pdf.getPage()/pdf.getPageIndex() use. Returns null for anything that
  // can't be resolved (e.g. a destination pointing outside this
  // document), so callers can just skip those links.
  async function resolveDestPdfPageIndex(pdf, dest){
    try{
      let explicitDest = dest;
      if(typeof dest === 'string'){
        explicitDest = await pdf.getDestination(dest);
      }
      if(!Array.isArray(explicitDest) || !explicitDest[0]) return null;
      return await pdf.getPageIndex(explicitDest[0]);
    }catch(e){
      return null;
    }
  }
  async function loadPdf(){
    // Prefer the server's pre-rendered/cached version when a backend is
    // present (see loadFromServerManifest's own comment) — only render
    // in-browser with pdf.js, below, when that's unavailable.
    const pdfFileName = pdfBasename(PDF_PATH);
    const usedServerManifest = await loadFromServerManifest(pdfFileName);
    if(usedServerManifest) return;

    let pdf;
    try{
      // PDF_PATH may be a path pulled straight out of the URL (see
      // resolvePdfPath above) rather than a plain relative filename, so
      // resolve it against the page's own URL the same way a normal href
      // would be, instead of assuming it's always relative to index.html.
      const resolvedUrl = new URL(PDF_PATH, window.location.href).href;
      const loadingTask = pdfjsLib.getDocument(resolvedUrl);
      pdf = await loadingTask.promise;
    }catch(err){
      console.error(err);
      showError();
      return;
    }

    totalPages = pdf.numPages;
    els.pageTotal.textContent = totalPages;

    // Show the document's own name in the browser tab instead of the
    // generic default: the PDF's own metadata Title (when the file
    // actually has one set) is the most accurate name, so it's tried
    // first; the filename (prettified by filenameFromPdfPath) is the
    // fallback both when there's no metadata Title at all, and when it's
    // one of the generic placeholder strings various PDF writers leave
    // behind (macOS Preview, old Word exports, etc.) when the author
    // never actually set a real title — showing that placeholder verbatim
    // is less useful than the file's own name.
    const GENERIC_PDF_TITLES = /^(untitled|untitled document|untitled-?\d*|documento sin t[ií]tulo|document\d*|new document|sin t[ií]tulo)$/i;
    try{
      const meta = await pdf.getMetadata();
      const metaTitle = meta && meta.info && typeof meta.info.Title === 'string' ? meta.info.Title.trim() : '';
      const usableMetaTitle = metaTitle && !GENERIC_PDF_TITLES.test(metaTitle) ? metaTitle : '';
      document.title = usableMetaTitle || filenameFromPdfPath(PDF_PATH);
    }catch(err){
      document.title = filenameFromPdfPath(PDF_PATH);
    }

    // First page -> determine aspect ratio
    const firstPage = await pdf.getPage(1);
    const baseViewport = firstPage.getViewport({ scale: 1 });
    aspectRatio = baseViewport.width / baseViewport.height;

    for(let i = 1; i <= totalPages; i++){
      setLoadingText(t('loadingRenderingPage', { page: i, total: totalPages }));
      setProgress((i-1) / totalPages * 100);

      const page = await pdf.getPage(i);
      const viewport = page.getViewport({ scale: RENDER_SCALE });
      lastRenderedViewport = viewport;

      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fbfaf7';
      ctx.fillRect(0,0,canvas.width, canvas.height);

      await page.render({ canvasContext: ctx, viewport: viewport }).promise;
      pageImages.push(canvas.toDataURL('image/jpeg', JPEG_QUALITY));

      try{
        const textContent = await page.getTextContent();
        const text = textContent.items.map(it => it.str).join(' ').replace(/\s+/g,' ').trim();
        pageTexts.push(text);

        const items = [];
        for(const it of textContent.items){
          if(!it.str || !it.str.trim()) continue;
          const tx = pdfjsLib.Util.transform(viewport.transform, it.transform);
          const fontHeight = Math.hypot(tx[2], tx[3]) || 1;
          const width = (it.width || 0) * viewport.scale;
          const left = tx[4];
          const top = tx[5] - fontHeight;
          items.push({
            str: it.str,
            xPct: (left / viewport.width) * 100,
            yPct: (top / viewport.height) * 100,
            wPct: (width / viewport.width) * 100,
            hPct: (fontHeight / viewport.height) * 100,
          });
        }
        pageTextItems.push(items);
      }catch(e){
        pageTexts.push('');
        pageTextItems.push([]);
      }

      // Link annotations (external URLs and internal "jump to page" links)
      // — positioned the same way as the text spans above: pdf.js's own
      // rect -> viewport conversion, then expressed as percentages of the
      // page so they land correctly however this page ends up scaled.
      // Kept in a separate try/catch from the text extraction above so a
      // problem reading annotations on one odd page can never take down
      // the (much more essential) text layer for that page.
      try{
        const annotations = await page.getAnnotations({ intent: 'display' });
        const linkItems = [];
        for(const ann of annotations){
          if(ann.subtype !== 'Link' || !ann.rect) continue;
          const rv = viewport.convertToViewportRectangle(ann.rect);
          // convertToViewportRectangle doesn't guarantee min/max order —
          // the viewport's own Y-flip (PDF user space is bottom-up) can
          // leave the two corners transposed, same as the text glyphs
          // above having to subtract fontHeight to find their true top.
          const x1 = Math.min(rv[0], rv[2]);
          const x2 = Math.max(rv[0], rv[2]);
          const y1 = Math.min(rv[1], rv[3]);
          const y2 = Math.max(rv[1], rv[3]);
          const wPct = ((x2 - x1) / viewport.width) * 100;
          const hPct = ((y2 - y1) / viewport.height) * 100;
          if(wPct <= 0 || hPct <= 0) continue;
          const xPct = (x1 / viewport.width) * 100;
          const yPct = (y1 / viewport.height) * 100;

          if(ann.url){
            linkItems.push({ xPct, yPct, wPct, hPct, kind: 'url', url: ann.url });
            continue;
          }
          // Internal "jump to page" link: dest may be a named destination
          // (a string needing pdf.getDestination() to look up) or an
          // already-explicit destination array — resolveDestPdfPageIndex
          // handles both. GoTo actions carry their destination the same
          // way, just nested one level deeper under .action.
          const destRaw = ann.dest || (ann.action && ann.action.dest);
          if(destRaw){
            const pdfPageIndex = await resolveDestPdfPageIndex(pdf, destRaw);
            if(pdfPageIndex != null){
              linkItems.push({ xPct, yPct, wPct, hPct, kind: 'page', pdfPageIndex });
            }
          }
        }
        pageLinkItems.push(linkItems);
      }catch(e){
        pageLinkItems.push([]);
      }

      // free canvas memory
      canvas.width = 0; canvas.height = 0;
    }

    // Keep the first and last page as lone covers, and make sure every page
    // in between can always pair up into a clean two-page spread: if the
    // number of middle pages is odd, insert one blank filler just before
    // the back cover, finalize internal links' page indices, and open the
    // book — shared with the server-manifest loading path above.
    finalizePagesAndOpenBook();
  }

  // ---------------- Init StPageFlip ----------------
  function computeBookSize(){
    const stageRect = els.stage.getBoundingClientRect();
    const availW = Math.max(320, stageRect.width - 150);
    const availH = Math.max(360, stageRect.height - 20);

    // spread (two pages) aspect ratio
    const spreadRatio = (aspectRatio * 2) / 1;

    let h = availH;
    let w = h * spreadRatio;
    if (w > availW){
      w = availW;
      h = w / spreadRatio;
    }
    const singleW = Math.floor(w / 2);
    const singleH = Math.floor(h);
    return { singleW, singleH };
  }

  // ---------------- Chrome sanitizer (shadows + blank cover companion) ----------------
  // StPageFlip generates its own internal DOM (shadow overlays for the page
  // curl/hard-cover bevel, and an empty placeholder page slot next to a
  // lone cover). We don't control that markup directly, so instead we
  // watch it with a MutationObserver and neutralize the parts we don't
  // want the instant the library creates or updates them — regardless of
  // the exact class names it happens to use internally.
  let sanitizeScheduled = false;
  function scheduleSanitizeBookChrome(){
    if(sanitizeScheduled) return;
    sanitizeScheduled = true;
    requestAnimationFrame(() => {
      sanitizeScheduled = false;
      sanitizeBookChrome();
    });
  }
  function sanitizeBookChrome(){
    if(!els.book) return;
    els.book.querySelectorAll('*').forEach((el) => {
      const cls = (typeof el.className === 'string') ? el.className : (el.className && el.className.baseVal) || '';
      // 1) Any shadow/gradient overlay the library draws for the page curl
      //    or the hard-cover bevel — kill it outright ("la sombra del pliego").
      if(/shadow/i.test(cls)){
        el.style.setProperty('display', 'none', 'important');
        return;
      }
      // 2) The central crease/gutter shadow between two open pages is often
      //    painted straight onto the page wrapper itself (a gradient
      //    background-image and/or an inset box-shadow), not as a separate
      //    element — so strip those from every non-image node inside the
      //    book, leaving the actual page background-color untouched.
      //    Exempt our own PDF-link hover affordance (.page-link-layer a's
      //    CSS :hover background/box-shadow) from this — it's real,
      //    intentional styling, not library chrome to sanitize away.
      if(el.tagName !== 'IMG' && !(el.classList && el.classList.contains('page-link-layer')) && !(el.closest && el.closest('.page-link-layer'))){
        el.style.setProperty('background-image', 'none', 'important');
        el.style.setProperty('box-shadow', 'none', 'important');
      }
      // 3) The blank companion slot shown next to a lone cover page: any
      //    ".page" wrapper that has no image inside it is that empty half,
      //    so make it blend with the viewer's own dark background instead
      //    of standing out as a stray white page.
      if(el.classList && el.classList.contains('page') && !el.querySelector('img')){
        el.style.setProperty('background', 'transparent', 'important');
      }
    });
  }
  let bookObserver = null;
  function watchBookChrome(){
    if(bookObserver) bookObserver.disconnect();
    bookObserver = new MutationObserver(scheduleSanitizeBookChrome);
    bookObserver.observe(els.book, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'style'] });
    scheduleSanitizeBookChrome();
  }

  // The natural (zoom-independent) page height, in px, exposed as a CSS
  // custom property so every text-layer span's font-size (set once at
  // build time as a calc() against this variable) stays correct even
  // after a window resize changes the book's natural size — without
  // having to rebuild every span.
  function updateNaturalPageHeightVar(){
    const { singleH } = computeBookSize();
    document.documentElement.style.setProperty('--natural-page-h', singleH + 'px');
  }

  // Builds one real DOM element per page (background image + a
  // transparent, selectable text layer positioned from pageTextItems)
  // and appends them into #book, ready for pageFlip.loadFromHTML(). This
  // replaces the old loadFromImages() image-mode approach so the PDF's
  // actual text stays native and selectable instead of being baked into
  // a bitmap.
  function buildPageElements(){
    els.book.innerHTML = '';
    updateNaturalPageHeightVar();

    const frag = document.createDocumentFragment();
    const spansToMeasure = [];

    for(let i = 0; i < totalPages; i++){
      const pageEl = document.createElement('div');
      pageEl.className = 'page';
      // Hard covers, same as showCover:true did for image mode — in HTML
      // mode this has to be declared explicitly per page.
      if(i === 0 || i === totalPages - 1) pageEl.dataset.density = 'hard';

      const inner = document.createElement('div');
      inner.className = 'page-inner';

      const img = document.createElement('img');
      img.className = 'page-bg';
      img.src = pageImages[i];
      img.alt = '';
      img.draggable = false;
      inner.appendChild(img);

      const textLayer = document.createElement('div');
      textLayer.className = 'page-text-layer';
      const items = pageTextItems[i] || [];
      for(const it of items){
        if(!it.str || !it.str.trim()) continue;
        const span = document.createElement('span');
        span.textContent = it.str;
        span.style.left = it.xPct + '%';
        span.style.top = it.yPct + '%';
        span.style.fontSize = 'calc(var(--natural-page-h) * ' + (it.hPct / 100).toFixed(6) + ')';
        textLayer.appendChild(span);
        spansToMeasure.push({ span, wPct: it.wPct });
      }
      inner.appendChild(textLayer);

      const linkLayer = document.createElement('div');
      linkLayer.className = 'page-link-layer';
      const linkItems = pageLinkItems[i] || [];
      for(const it of linkItems){
        const a = document.createElement('a');
        a.style.left = it.xPct + '%';
        a.style.top = it.yPct + '%';
        a.style.width = it.wPct + '%';
        a.style.height = it.hPct + '%';
        if(it.kind === 'url'){
          a.href = it.url;
          // Any link leaving the document opens in a new tab rather than
          // navigating this one away — this viewer has no history/back
          // button of its own, so replacing it outright would strand the
          // reader with no way back to the document.
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.title = it.url;
        }else if(it.kind === 'page' && it.pageIndex != null){
          // Internal "jump to page" link: a real href (so middle-click/
          // right-click "open in new tab" still does something sane —
          // it re-opens this same document) plus a click handler that
          // does the actual in-place page turn and stops the browser
          // from following the href as a real navigation.
          a.href = '#page=' + (it.pageIndex + 1);
          a.dataset.pageIndex = String(it.pageIndex);
          a.addEventListener('click', (e) => {
            e.preventDefault();
            if(pageFlip) pageFlip.turnToPage(it.pageIndex);
          });
        }else{
          continue;
        }
        linkLayer.appendChild(a);
      }
      inner.appendChild(linkLayer);

      pageEl.appendChild(inner);
      frag.appendChild(pageEl);
    }
    els.book.appendChild(frag);

    // Second pass, after layout: stretch/squeeze each span horizontally
    // (via scaleX) so its rendered width matches the original PDF glyph
    // run's width. The browser's substitute font never has identical
    // metrics to whatever font was embedded in the PDF, so without this
    // correction the invisible text drifts out of alignment with what's
    // visible underneath, and dragging to select would cover the wrong
    // area. Same technique pdf.js's own text layer uses.
    requestAnimationFrame(() => {
      spansToMeasure.forEach(({ span, wPct }) => {
        const parent = span.parentElement;
        if(!parent) return;
        const naturalPx = span.getBoundingClientRect().width || 1;
        const targetPx = (wPct / 100) * parent.clientWidth;
        if(targetPx > 0){
          span.style.width = naturalPx + 'px';
          span.style.transform = 'scaleX(' + (targetPx / naturalPx).toFixed(4) + ')';
        }
      });
    });
  }

  function initBook(){
    const { singleW, singleH } = computeBookSize();

    try{
      pageFlip = new St.PageFlip(els.book, {
        width: singleW,
        height: singleH,
        size: "stretch",
        minWidth: 200,
        // StPageFlip's own "stretch" auto-sizing caps each page's *real*
        // pixel layout size at maxWidth/maxHeight, regardless of how
        // large its container (#book-zoom-wrap) actually is — on a large
        // or ultra-wide monitor, the old 1400×1900 cap could end up
        // smaller than the natural (100%-zoom) size the viewport would
        // otherwise allow, meaning the page (and the image inside it)
        // gets laid out and painted at that capped, lower resolution and
        // only reaches its true on-screen size via this viewer's own
        // zoom transform — the exact kind of avoidable quality loss this
        // is meant to eliminate. Raised well above any realistic
        // viewport-driven natural size (and above the rendered page
        // images' own native resolution — see RENDER_SCALE) so this cap
        // is never what's actually limiting the resolution content gets
        // laid out and painted at.
        maxWidth: 3000,
        minHeight: 280,
        maxHeight: 4000,
        maxShadowOpacity: 0,
        showCover: true,
        mobileScrollSupport: false,
        useMouseEvents: true,
        swipeDistance: 30,
        drawShadow: false,
        flippingTime: 650,
        usePortrait: true,
        autoSize: true,
      });

      // HTML mode: build real page DOM elements (image + selectable text
      // layer) ourselves and hand them to StPageFlip, instead of letting
      // it rasterize everything onto its own internal <canvas> the way
      // loadFromImages() does. This is what keeps the PDF's text native
      // and selectable/copyable rather than baked into a bitmap.
      buildPageElements();
      // The library's own docs disagree on the casing of this method
      // (loadFromHTML vs loadFromHtml) across versions/mirrors, so check
      // for whichever one this bundle actually exposes.
      const loadHtml = pageFlip.loadFromHTML || pageFlip.loadFromHtml;
      loadHtml.call(pageFlip, els.book.querySelectorAll('.page'));
      watchBookChrome();

      // The central "gutter" shadow between the two open pages, and the
      // white-canvas-showing-through companion slot next to a lone cover,
      // were both artifacts of the old canvas-based render mode (baked
      // straight into canvas pixels via drawBookShadow()/clear()). HTML
      // mode instead renders real DOM elements, so those two fixes only
      // apply — and only run — when getRender() actually returns a
      // canvas-backed render instance.
      const renderInstance = pageFlip.getRender && pageFlip.getRender();
      if(renderInstance && renderInstance.canvas && renderInstance.ctx){
        renderInstance.drawBookShadow = function(){};

        const viewerBg = (getComputedStyle(document.documentElement).getPropertyValue('--bg-viewer') || '#232323').trim() || '#232323';
        renderInstance.clear = function(){
          this.ctx.fillStyle = viewerBg;
          this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        };
      }

      // StPageFlip's flip/drag/corner-fold hit-testing is expressed in the
      // *unscaled* page geometry it was built with (see computeBookSize).
      // Its default getMousePos() reads the raw on-screen pointer offset
      // via getBoundingClientRect(), which already reflects our zoom
      // transform — so the instant zoomLevel !== 1, that raw offset no
      // longer matches the library's internal coordinate system, and every
      // flip/drag interaction zone drifts out of alignment with the
      // actual visible page (triggering well outside — or requiring a
      // click well inside — the real page edges). Dividing the pointer
      // offset by the current zoom factor converts it back into the same
      // unscaled space the library's geometry uses, keeping every
      // interactive region correctly aligned with the visible page at any
      // zoom level and pan position.
      const uiInstance = pageFlip.getUI && pageFlip.getUI();
      if(uiInstance){
        uiInstance.getMousePos = function(clientX, clientY){
          const rect = this.distElement.getBoundingClientRect();
          return {
            x: (clientX - rect.left) / zoomLevel,
            y: (clientY - rect.top) / zoomLevel
          };
        };
      }

      pageFlip.on('flip', (e) => {
        updatePageIndicator();
        updateThumbActive(e.data);
        renderDocumentHighlights();
        scheduleSanitizeBookChrome();
      });
      pageFlip.on('changeState', (e) => {
        // Hide the highlight overlay mid-flip so it never appears detached
        // from the page that's animating, then redraw once settled.
        if(e.data === 'flipping'){ clearDocumentHighlights(); }
        else if(e.data === 'read'){
          renderDocumentHighlights();
          // The page(s) just settled into view — whether that's a lone
          // cover or a full spread, re-measure and smoothly re-center it
          // horizontally (the transform this animates is CSS-transitioned,
          // so this is a slide, not a jump), and re-check whether it's
          // cropped now (a spread can overflow where a single page didn't,
          // even at the same zoom level).
          scheduleRecenterBookHorizontally();
          updatePanAffordance();
        }
        scheduleSanitizeBookChrome();
      });

      updatePageIndicator();
      buildThumbnails();
      updateNavArrows();
      syncHighlightOverlayBox();
      // Re-run zoom/pan sizing now that the real PDF aspect ratio (used by
      // computeBookSize) is known, rather than the generic fallback used
      // for the very first boot-time layout. applyZoom() already snaps
      // straight to the correct size/position itself (it always jumps
      // directly to zoomLevel, suppressing the sizer/wrap's transition
      // for its own synchronous update — see applyZoom()'s own comment),
      // so nothing extra is needed here to avoid an animated reveal.
      //
      // Previously the loading overlay was hidden (classList.add('hidden'),
      // starting its own 0.4s opacity fade-out) *before* any of this ran —
      // so the very first sizing/centering of the spread, including
      // StPageFlip's own async autoSize resize, was still visibly
      // happening underneath the spinner while it faded away, letting the
      // two overlap instead of one cleanly finishing before the other
      // starts. Fixed by doing the opposite: keep the overlay fully
      // opaque (don't touch it at all yet) while the spread lays itself
      // out, and only begin the fade once it's actually finished —
      // scheduleRecenterBookHorizontally's own settle pass (immediate +
      // next frame + a 260ms fallback, the same window already trusted
      // elsewhere in this file for post-resize/post-flip settling) is
      // reused here via its onSettled callback, so the overlay only
      // starts disappearing once the spread is confirmed to be in its
      // final, centered position — never while it's still moving.
      applyZoom();
      positionNavArrows();
      scheduleRecenterBookHorizontally(() => {
        els.loadingOverlay.classList.add('hidden');
      });
    }catch(err){
      console.error('No se pudo inicializar el flipbook:', err);
      showError();
    }
  }

  function updatePageIndicator(){
    if(!pageFlip) return;
    const idx = pageFlip.getCurrentPageIndex();
    const orientation = pageFlip.getOrientation();
    // Mirrors the spread detection in getVisiblePages(): two pages are on
    // screen at once whenever we're in landscape orientation and not on a
    // lone front/back cover, so the indicator should read as a range.
    const isSpread = orientation === 'landscape' && idx > 0 && idx < totalPages - 1;
    if(isSpread){
      const start = Math.min(idx + 1, totalPages);
      const end = Math.min(idx + 2, totalPages);
      els.pageCurrent.textContent = start === end ? String(start) : (start + '\u2013' + end);
    }else{
      els.pageCurrent.textContent = Math.min(idx + 1, totalPages);
    }
  }

  function updateNavArrows(){
    if(!pageFlip) return;
    const idx = pageFlip.getCurrentPageIndex();
    els.btnPrev.classList.toggle('disabled', idx <= 0);
    els.btnNext.classList.toggle('disabled', idx >= totalPages - 1);
  }

  // The nav arrows are position:fixed (viewport-relative) so they stay put
  // no matter how the document is panned or zoomed. "top: 50%" on a fixed
  // element centers against the whole viewport, though, not against
  // #stage's own box (which excludes the title bar and bottom toolbar) —
  // so their vertical center is written here as an explicit pixel value
  // matching #stage's actual on-screen center, recalculated whenever the
  // layout can change.
  function positionNavArrows(){
    const rect = els.stage.getBoundingClientRect();
    const midY = rect.top + rect.height / 2;
    els.btnPrev.style.top = midY + 'px';
    els.btnNext.style.top = midY + 'px';
  }

  // ---------------- Navigation ----------------
  els.btnPrev.addEventListener('click', () => { if(pageFlip){ pageFlip.flipPrev(); } });
  els.btnNext.addEventListener('click', () => { if(pageFlip){ pageFlip.flipNext(); } });

  document.addEventListener('keydown', (e) => {
    // Ctrl+F (Cmd+F on macOS) should open this viewer's own in-document
    // search panel instead of the browser's native find bar — checked

    // below (and before the `!pageFlip` guard) so it reliably wins even
    // when focus is already inside our own search box, or the document
    // hasn't finished loading yet.
    if((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === 'f' || e.key === 'F')){

  // ---------------- Pan mode (content cropped) ----------------
  // Whenever the document is actually larger than the visible viewport in
  // either dimension — i.e. any part of it is cropped, at whatever zoom
  // level got it there — StPageFlip's own drag-to-turn is disabled
  // outright (not just restricted to the edges), and dragging anywhere
  // instead pans around the page by moving #stage's scroll position
  // directly. #stage itself is always overflow:hidden (no scrollbars, no
  // native scroll input) — panning is the *only* way to move around
  // cropped content, and this is what decides when that's needed.
  // Hysteresis, not a single hard cutoff: pan mode only switches ON once
  // the document is *clearly* cropped (not the instant a single pixel
  // spills past the edge), and only switches back OFF once it's clearly
  // back within the viewport — so a fit that sits right at the boundary
  // can't flicker between the two on every tiny measurement wobble.
  let panModeActive = false;
  const PAN_ENTER_OVERFLOW_PX = 16;
  const PAN_EXIT_OVERFLOW_PX = 6;

  // ---------------- Pan bounds (single source of truth) ----------------
  // #stage relies on native scrollLeft/scrollTop for panning, but the
  // matching scrollWidth/scrollHeight the browser reports are NOT a
  // reliable way to derive pan limits: per spec/engine behavior, a
  // scrollable box's scrollWidth/scrollHeight only reliably include the
  // *leading* padding (left/top) once content overflows — the *trailing*
  // padding (right/bottom) is only included if content happens to extend
  // into it, which our centered, non-overflowing-by-design sizer never
  // does. That silently shrank the reachable range on the right/bottom by
  // the trailing padding each time, which is exactly why panning used to
  // stop short of the bottom-right corner while the top-left stayed fully
  // reachable — an asymmetric limit despite the padding being symmetric.
  //
  // The fix is to stop asking the DOM for the scrollable extent at all and
  // instead compute it directly from numbers we already control: the
  // document's current on-screen (scaled) size vs. the stage's available
  // (padding-excluded) viewport size. That gives an exact, symmetric
  // scrollLeft/scrollTop range of [0, max] on both axes — 0 when the
  // document fits (no panning needed, it's centered via margin instead)
  // and max = scaled size − available size once it's larger than the
  // viewport, which lines up exactly with every edge/corner of the
  // document, including the far bottom-right.
  //
  // On top of that base range, an extra reachable buffer (see
  // computePanExtra, right below) is added symmetrically on every
  // overflowing side, so the range doesn't stop the instant an edge is
  // merely flush with the viewport — it continues far enough that any
  // edge, or with both axes at once any corner, can be pulled all the
  // way in to the center of the screen.
  let currentScaledW = 0;
  let currentScaledH = 0;
  function getStageAvail(){
    const stageRect = els.stage.getBoundingClientRect();
    const cs = getComputedStyle(els.stage);
    const padL = parseFloat(cs.paddingLeft) || 0;
    const padT = parseFloat(cs.paddingTop) || 0;
    const padR = parseFloat(cs.paddingRight) || 0;
    const padB = parseFloat(cs.paddingBottom) || 0;
    return {
      padL, padT, padR, padB,
      availW: Math.max(0, stageRect.width - padL - padR),
      availH: Math.max(0, stageRect.height - padT - padB)
    };
  }
  // How much extra "overscroll" reach to grant beyond the point where an
  // edge is merely flush with the viewport edge, in each dimension that's
  // actually overflowing right now. Half the viewport's own size is
  // exactly the amount needed so that panning all the way to an extreme
  // brings that edge — or, with both axes maxed out together, a whole
  // corner — in to the *center* of the screen rather than just up to its
  // boundary. A document that already fits gets none of this (it isn't
  // panned at all; it stays centered via margin as before). Shared by
  // getPanMax (the clamp bound) and every place that converts between
  // screen and natural document coordinates (applyZoom, animateZoomTo,
  // captureZoomAnchorAtOffset), so all of them always agree on the exact
  // same buffer.
  function computePanExtra(scaledW, scaledH){
    const { availW, availH } = getStageAvail();
    return {
      extraX: (scaledW - availW) > 0 ? availW / 2 : 0,
      extraY: (scaledH - availH) > 0 ? availH / 2 : 0
    };
  }
  function getPanMax(scaledW, scaledH){
    const { availW, availH } = getStageAvail();
    const overflowX = Math.max(0, scaledW - availW);
    const overflowY = Math.max(0, scaledH - availH);
    const { extraX, extraY } = computePanExtra(scaledW, scaledH);
    // The extra buffer is added on BOTH the leading and trailing side of
    // the document (see applyZoom/animateZoomTo, which bake it into
    // #book-zoom-sizer's real box on both sides via CSS margin) so it has
    // to be counted twice here too — once for the room to pull the
    // leading edge in from scrollLeft 0, once for the room to push the
    // trailing edge in at the far end.
    return {
      maxX: overflowX > 0 ? overflowX + extraX * 2 : 0,
      maxY: overflowY > 0 ? overflowY + extraY * 2 : 0
    };
  }
  function clampScrollToPanBounds(){
    const { maxX, maxY } = getPanMax(currentScaledW, currentScaledH);
    if(els.stage.scrollLeft > maxX) els.stage.scrollLeft = maxX;
    if(els.stage.scrollTop > maxY) els.stage.scrollTop = maxY;
  }

  // StPageFlip's own mousedown/touchstart listeners live inside #book, and
  // beyond those it also wires up window-level mousemove/touchmove
  // listeners and a corner-hover "peek" fold that don't need a press at
  // all. gateFlipDrag (below) stops a press from ever reaching any of
  // that while pan mode is active, but the peek and window-level tracking
  // would otherwise keep responding to the cursor regardless. Fully
  // detaching StPageFlip's own handlers via its UI instance while pan
  // mode is on (and reattaching once it's off) makes the disable
  // complete rather than press-only.
  let flipHandlersDetachedForPan = false;
  function syncFlipHandlersForPanMode(){
    if(!pageFlip || !pageFlip.getUI) return;
    const ui = pageFlip.getUI();
    if(!ui) return;
    if(panModeActive && !flipHandlersDetachedForPan){
      if(typeof ui.removeHandlers === 'function'){
        ui.removeHandlers();
        flipHandlersDetachedForPan = true;
      }
    }else if(!panModeActive && flipHandlersDetachedForPan && !isPanning){
      // Deliberately skipped while a pan gesture is still in progress
      // (isPanning): our own pan drag is still tracking this same press,
      // and StPageFlip regaining its window-level mousemove listener
      // mid-gesture would let its corner-hover "peek" fire while the
      // user is still actively dragging, fighting visually with the pan.
      // endPan() below re-runs this the moment the gesture actually ends,
      // so the reattachment is only ever deferred, never skipped.
      if(typeof ui.setHandlers === 'function'){
        ui.setHandlers();
        flipHandlersDetachedForPan = false;
      }
    }
  }

  // Single source of truth for pan-mode state. Every call site — a fresh
  // press about to be gated, a zoom change, a page settling after a flip,
  // a pan gesture ending — measures current overflow, updates
  // panModeActive with hysteresis, and immediately keeps the pan-mode CSS
  // affordance and StPageFlip's attached handlers in lockstep with it,
  // all in the same synchronous call. Previously gateFlipDrag read
  // overflow through a separate, side-effect-only helper that updated
  // panModeActive but never touched the CSS class or handler attachment —
  // so a press could flip pan mode on/off for that gesture while the rest
  // of the app (the pan-active cursor, StPageFlip's own listeners) kept
  // running on a stale reading, which is exactly the kind of drift that
  // made the two modes feel unreliable and occasionally conflict. Because
  // this is now the *only* place panModeActive is ever written, that
  // drift isn't possible any more, however many places call it.
  function isContentOverflowing(){
    if(!els.stage) return panModeActive;
    // Derived the same way as getPanMax(), from the document's actual
    // scaled size vs. the stage's real available area — not from
    // stage.scrollWidth/scrollHeight, whose trailing-padding exclusion
    // (see the comment above getStageAvail) made this measurement
    // unreliable near the pan boundary too.
    const { availW, availH } = getStageAvail();
    const overflowX = currentScaledW - availW;
    const overflowY = currentScaledH - availH;
    const maxOverflow = Math.max(overflowX, overflowY);
    panModeActive = panModeActive
      ? maxOverflow > PAN_EXIT_OVERFLOW_PX
      : maxOverflow > PAN_ENTER_OVERFLOW_PX;
    els.stage.classList.toggle('pan-active', panModeActive);
    syncFlipHandlersForPanMode();
    return panModeActive;
  }
  function updatePanAffordance(){
    // isContentOverflowing() now does all the work as a side effect of
    // measuring — kept as a separate, readably-named call at the sites
    // that were already calling it that way.
    isContentOverflowing();
  }

  let isPanning = false;
  let panStartX = 0, panStartY = 0, panStartScrollLeft = 0, panStartScrollTop = 0;
  function startPan(clientX, clientY){
    isPanning = true;
    panStartX = clientX;
    panStartY = clientY;
    panStartScrollLeft = els.stage.scrollLeft;
    panStartScrollTop = els.stage.scrollTop;
    els.stage.classList.add('panning');
  }
  function movePan(clientX, clientY){
    if(!isPanning) return;
    const { maxX, maxY } = getPanMax(currentScaledW, currentScaledH);
    let newLeft = panStartScrollLeft - (clientX - panStartX);
    let newTop = panStartScrollTop - (clientY - panStartY);
    // Clamp against our own computed bounds rather than trusting the
    // browser's native scrollLeft/scrollTop auto-clamping — that native
    // clamp is derived from scrollWidth/scrollHeight, which (see
    // getStageAvail's comment) undercounts the reachable range on the
    // trailing edges. Clamping here guarantees every corner, including
    // bottom-right, is actually reachable by drag.
    newLeft = Math.max(0, Math.min(maxX, newLeft));
    newTop = Math.max(0, Math.min(maxY, newTop));
    els.stage.scrollLeft = newLeft;
    els.stage.scrollTop = newTop;
  }
  function endPan(){
    if(!isPanning) return;
    isPanning = false;
    els.stage.classList.remove('panning');
    // Completes any handler reattachment that syncFlipHandlersForPanMode
    // deferred while this gesture was still in progress (see above).
    syncFlipHandlersForPanMode();
  }
  document.addEventListener('mousemove', (e) => movePan(e.clientX, e.clientY));
  document.addEventListener('mouseup', endPan);
  document.addEventListener('touchmove', (e) => {
    if(pinchActive){ movePinch(e); return; }
    if(!isPanning) return;
    const t = e.touches && e.touches[0];
    if(!t) return;
    e.preventDefault();
    movePan(t.clientX, t.clientY);
  }, { passive: false });
  function handleTouchFingerLift(e){

    // was lifted, or the gesture was cancelled) — touchend/touchcancel
    // fire per finger, with e.touches already reflecting whichever ones
    // are still down.
    if(pinchActive && (!e.touches || e.touches.length < 2)) endPinch();

  }
  document.addEventListener('touchend', handleTouchFingerLift);
  document.addEventListener('touchcancel', handleTouchFingerLift);

  // ---------------- Pinch-to-zoom (touch) ----------------
  // A second finger touching down always means "pinch to zoom" — unlike
  // a single-finger press (gated by content-overflow state just below),
  // this should work regardless of whether the document currently
  // overflows the viewport, exactly like iOS/iPadOS's own native pinch
  // gesture would if it weren't disabled (see the viewport meta tag and
  // the gesturestart/gesturechange suppression further down — both
  // needed so Safari's own native page-zoom doesn't fire at the same
  // time as this and fight it).
  let pinchActive = false;
  let pinchStartDist = 0;
  let pinchStartZoom = 1;
  function touchDistance(a, b){
    return Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
  }
  function touchMidpoint(a, b){
    return { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
  }
  // zoomAnchorOffsetX/Y (see their own declaration, above the zoom
  // functions further down) are in stage-relative coordinates, i.e.
  // relative to #stage's own left/top edge — the same space
  // getBoundingClientRect() needs undoing for, hence the subtraction here.
  function updatePinchAnchorOffset(midX, midY){
    const stageRect = els.stage.getBoundingClientRect();
    zoomAnchorOffsetX = midX - stageRect.left;
    zoomAnchorOffsetY = midY - stageRect.top;
  }
  function startPinch(e){
    const a = e.touches[0], b = e.touches[1];
    pinchActive = true;
    pinchStartDist = touchDistance(a, b);
    pinchStartZoom = zoomLevel;
    // Two fingers landing takes over from anything already in progress —
    // a button-triggered zoom animation or an existing single-finger pan
    // — since the pinch is now in sole control of the zoom level.
    cancelZoomAnimation();
    endPan();
    const mid = touchMidpoint(a, b);
    updatePinchAnchorOffset(mid.x, mid.y);
    // Capture which natural (unscaled) document point currently sits
    // under the fingers' midpoint — captured once, here, at gesture
    // start. This is the point that then stays fixed under the fingers
    // as the pinch continues (see movePinch), exactly like a native
    // pinch-zoom: only the target on-screen offset keeps tracking the
    // fingers every move, not the underlying document point itself.
    captureZoomAnchorAtOffset(zoomAnchorOffsetX, zoomAnchorOffsetY);
  }
  function movePinch(e){
    if(!pinchActive) return;
    const a = e.touches[0], b = e.touches[1];
    if(!a || !b) return;
    e.preventDefault();
    if(pinchStartDist > 0){
      const scaleFactor = touchDistance(a, b) / pinchStartDist;
      zoomLevel = Math.max(ZOOM_MIN_PCT / 100, Math.min(ZOOM_MAX_PCT / 100, pinchStartZoom * scaleFactor));
    }
    // Track the midpoint's current screen position every move too — as
    // the user's fingers drift while pinching (not just spreading apart
    // in place), the anchor point captured at gesture start follows
    // them, letting a single gesture zoom and pan together the way a
    // native pinch does, instead of only ever zooming toward whatever
    // point the fingers first landed on.
    const mid = touchMidpoint(a, b);
    updatePinchAnchorOffset(mid.x, mid.y);
    applyZoom();
  }
  function endPinch(){
    if(!pinchActive) return;
    pinchActive = false;
    // Back to the default (viewport-center) anchor offset for every
    // subsequent slider/button zoom, until the next pinch sets it again.
    zoomAnchorOffsetX = null;
    zoomAnchorOffsetY = null;
  }
